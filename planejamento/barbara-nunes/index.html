<html lang="pt-BR">
<head>

<title>Plano da Bárbara</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#05070a;--surface-card:linear-gradient(180deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.018) 100%);--surface-1:rgba(255,255,255,.028);--surface-2:rgba(255,255,255,.048);--surface-inset:rgba(0,0,0,.35);--border-subtle:rgba(255,255,255,.07);--border-default:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.2);--border-accent:rgba(0,216,245,.45);--text-strong:#f2f6fa;--text-body:#c9d2dd;--text-muted:#9aa6b6;--text-faint:#6b788a;--text-accent:#37e6ff;--accent:#00d8f5;--accent-hover:#37e6ff;--accent-soft:rgba(0,216,245,.12);--accent-soft-hover:rgba(0,216,245,.2);--on-accent:#00171c;--green:#23d18b;--amber:#ffb020;--red:#ff4d5e;--red-soft:rgba(255,77,94,.1);--grad-ink:linear-gradient(180deg,#f2f6fa 0%,#9aa6b6 100%);--grad-signal:linear-gradient(135deg,#37e6ff 0%,#004aad 100%);--elev-card:0 12px 32px -8px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06);--glow-sm:0 0 12px -2px rgba(0,216,245,.45),0 0 2px rgba(0,216,245,.5);--glow-md:0 0 24px -4px rgba(0,216,245,.5),0 0 60px -12px rgba(0,216,245,.3);--r-control:12px;--r-card:18px;--r-pill:999px;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;--ease-out:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}html,body{background:var(--bg)}[hidden]{display:none!important}
body{margin:0;color:var(--text-body);font-family:var(--sans);font-size:15px;line-height:1.55;letter-spacing:-.008em;-webkit-font-smoothing:antialiased}
.halo{position:absolute;inset:0 0 auto 0;height:520px;pointer-events:none;z-index:0;background:radial-gradient(60% 60% at 50% 0%,rgba(0,216,245,.18) 0%,rgba(0,74,173,.10) 45%,rgba(0,0,0,0) 100%)}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding-inline:16px}@media (min-width:640px){.wrap{padding-inline:24px}}
.top{padding-block:28px 20px;display:grid;gap:18px}.brand{display:flex;align-items:center;gap:10px}
.ring{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);box-shadow:var(--glow-sm);display:grid;place-items:center;font:700 10px/1 var(--mono);color:var(--text-accent)}
.wordmark{font:800 17px/1 var(--sans);letter-spacing:-.03em;background:var(--grad-ink);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-accent);display:inline-flex;align-items:center;gap:8px}.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
h1{margin:0;font:800 clamp(30px,7vw,48px)/1.04 var(--sans);letter-spacing:-.035em;text-wrap:balance;background:var(--grad-ink);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin:0;max-width:60ch;color:var(--text-muted);font-size:16px}.who{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 12px/1 var(--mono);color:var(--text-body);padding:8px 12px;border-radius:var(--r-pill);border:1px solid var(--border-default);background:var(--surface-1)}
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,rgba(5,7,10,.94) 0%,rgba(5,7,10,.86) 100%);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--border-subtle)}
.tabs{max-width:880px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;scroll-padding-inline:16px}.tabs::-webkit-scrollbar{display:none}@media (min-width:640px){.tabs{padding-inline:24px;flex-wrap:wrap}}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--border-default);background:var(--surface-1);color:var(--text-muted);font:500 13.5px/1 var(--sans);cursor:pointer;transition:border-color .18s var(--ease-out),background .18s var(--ease-out),color .18s var(--ease-out)}
.tab .n{font:600 11px/1 var(--mono);color:var(--text-faint)}.tab:hover{color:var(--text-strong);border-color:var(--border-strong)}
.tab[aria-selected="true"]{border-color:var(--border-accent);background:var(--accent-soft-hover);color:#b3f7ff;box-shadow:var(--glow-sm)}.tab[aria-selected="true"] .n{color:var(--text-accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:28px 40px}.panel{display:grid;gap:22px;animation:fade .32s var(--ease-out)}@keyframes fade{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.panel{animation:none}*{transition:none!important}}
.phead{display:grid;gap:10px}
h2{margin:0;font:700 clamp(24px,5.4vw,34px)/1.16 var(--sans);letter-spacing:-.022em;color:var(--text-strong);text-wrap:balance}
h3{margin:0;font:700 18px/1.3 var(--sans);letter-spacing:-.015em;color:var(--text-strong);text-wrap:balance}
h4{margin:0;font:600 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
p{margin:0;max-width:64ch}.intro{color:var(--text-muted);font-size:16px}strong{color:var(--text-strong);font-weight:600}.accent{color:var(--text-accent)}
.card{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--r-card);box-shadow:var(--elev-card);padding:20px;display:grid;gap:14px}@media (min-width:640px){.card{padding:24px}}
.card.hl{border-color:var(--border-accent);box-shadow:var(--elev-card),var(--glow-md)}.card.flat{background:var(--surface-1);box-shadow:none}
.card-title{display:flex;align-items:center;gap:10px}.ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--text-accent);border:1px solid rgba(0,216,245,.25)}.ic svg{width:18px;height:18px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.metrics{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.metric{padding:16px;border-radius:14px;background:var(--surface-1);border:1px solid var(--border-subtle);display:grid;gap:6px;align-content:start}
.metric .v{font:600 28px/1.1 var(--mono);color:var(--text-strong);letter-spacing:-.01em;font-variant-numeric:tabular-nums}.metric .v.acc{color:var(--text-accent);text-shadow:0 0 18px rgba(0,216,245,.35)}.metric .l{font-size:13px;color:var(--text-muted);line-height:1.4}
ol.list,ul.list{margin:0;padding:0;list-style:none;display:grid;gap:12px}ul.list li{position:relative;padding-left:20px}ul.list li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.8}
ol.list{counter-reset:s}ol.list li{counter-increment:s;position:relative;padding-left:40px;min-height:28px}ol.list li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:1px;font:600 12px/1 var(--mono);color:var(--text-accent);padding:6px 0;width:28px;text-align:center;border-radius:8px;background:var(--accent-soft)}
.tag{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:var(--r-pill);width:max-content;max-width:100%}
.tag.rec{color:#b3f7ff;background:var(--accent-soft);border:1px solid var(--border-accent)}.tag.warn{color:var(--amber);background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.35)}.tag.neg{color:var(--red);background:var(--red-soft);border:1px solid rgba(255,77,94,.35)}.tag.ok{color:var(--green);background:rgba(35,209,139,.1);border:1px solid rgba(35,209,139,.35)}
.quote{padding:18px 20px;border-radius:var(--r-card);background:var(--surface-inset);border:1px solid var(--border-subtle);display:grid;gap:8px}.quote p{font-size:17px;line-height:1.5;color:var(--text-strong);font-weight:500;letter-spacing:-.012em}.quote .src{font:500 12px/1 var(--mono);color:var(--text-muted)}
.kv{display:grid;gap:10px}.kv div{display:grid;gap:2px}.kv dt{font:600 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}.kv dd{margin:0}dl{margin:0}
.tl{display:grid;position:relative}.step{display:grid;grid-template-columns:64px 1fr;gap:14px;position:relative;padding-bottom:22px}.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:31px;top:34px;bottom:0;width:1px;background:linear-gradient(180deg,rgba(0,216,245,.5),rgba(0,216,245,.08))}.step:last-child::before{display:none}
.dayb{height:34px;border-radius:var(--r-pill);display:grid;place-items:center;font:600 12px/1 var(--mono);color:var(--text-accent);background:var(--bg);border:1px solid var(--border-accent);position:relative;z-index:1;font-variant-numeric:tabular-nums}
.step.opt .dayb{color:var(--text-muted);border:1px dashed var(--border-strong)}.step .body{display:grid;gap:6px;padding-top:6px}
.script{border-radius:14px;background:var(--surface-inset);border:1px solid var(--border-default);overflow:hidden}
.script-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--border-subtle)}.script-h span{font:600 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.script-b{padding:14px 16px;display:grid;gap:10px;color:var(--text-strong);font-size:15px}.script-b p{max-width:none}.script-b .ph{color:var(--text-accent);font-family:var(--mono);font-size:13.5px}.script-note{padding:0 16px 14px;font-size:13px;color:var(--text-muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border-radius:var(--r-control);font:600 13px/1 var(--sans);cursor:pointer;border:1px solid var(--border-accent);background:var(--accent-soft);color:#b3f7ff;transition:background .18s var(--ease-out),box-shadow .18s var(--ease-out),transform .12s var(--ease-out);text-decoration:none}
.btn:hover{background:var(--accent-soft-hover);box-shadow:var(--glow-sm)}.btn:active{transform:scale(.975)}.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.btn.primary:hover{background:var(--accent-hover)}.btn.ghost{background:transparent;border-color:var(--border-default);color:var(--text-body)}.btn svg{width:15px;height:15px}
.vs{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.progress{display:grid;gap:10px}.bar{height:8px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;border:1px solid var(--border-subtle)}.bar i{display:block;height:100%;width:0;background:var(--grad-signal);box-shadow:0 0 12px rgba(0,216,245,.5);transition:width .3s var(--ease-out)}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.prog-row .v{font:600 22px/1 var(--mono);color:var(--text-strong);font-variant-numeric:tabular-nums}
.checks{display:grid;gap:4px}.check{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;padding:10px 8px;border-radius:10px;cursor:pointer}.check:hover{background:var(--surface-1)}.check input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border-strong);display:grid;place-items:center;margin-top:1px;transition:all .15s var(--ease-out)}
.box::after{content:"";width:10px;height:6px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked+.box{background:var(--accent);border-color:var(--accent);box-shadow:var(--glow-sm)}.check input:checked+.box::after{opacity:1}
.check input:checked~.t{color:var(--text-muted);text-decoration:line-through;text-decoration-color:rgba(154,166,182,.5)}.check .t{color:var(--text-body)}.check .t small{display:block;color:var(--text-muted);font-size:13px;margin-top:2px}
.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--border-subtle);margin-top:6px;padding-block:20px 0}.pager .btn{min-height:44px;flex:1 1 0;max-width:260px}.pager .btn.next{margin-left:auto}.pager .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer{padding-block:28px 40px;border-top:1px solid var(--border-subtle);color:var(--text-faint);font:500 12px/1.5 var(--mono)}.note{font-size:13px;color:var(--text-muted)}
.grid2{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}.vs{grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr))}.metrics{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.card .card.flat{padding:16px}.tag{white-space:normal;line-height:1.3}
/* fotos */
.people{display:flex;flex-wrap:wrap;align-items:center;gap:14px}.duo{display:flex;flex:0 0 auto}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--border-accent),var(--glow-sm);background:var(--surface-2)}.duo .av+.av{margin-left:-12px}
.av.lg{width:88px;height:88px}
.photo-card{padding:0;gap:0;overflow:hidden;grid-template-columns:1fr}.photo-card>img{display:block;width:100%;height:280px;object-fit:cover}
.photo-card .pc-b{padding:20px;display:grid;gap:12px;align-content:center}
@media (min-width:640px){.photo-card{grid-template-columns:260px 1fr}.photo-card>img{height:100%;min-height:320px}.photo-card .pc-b{padding:24px}}
.signoff{grid-template-columns:1fr;align-items:start}.signoff .pc-b{display:grid;gap:12px}@media (min-width:640px){.signoff{grid-template-columns:88px 1fr;gap:20px}}
/* oferta por R */
.offer{display:grid;gap:10px}.orow{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--surface-1);border:1px solid var(--border-subtle)}.orow .od{display:grid;gap:6px}
@media (min-width:640px){.orow{grid-template-columns:210px 1fr;align-items:start}}
.orow .tag{white-space:normal;line-height:1.3}
/* senha */
#lock{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--bg);z-index:30}
#lock::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 0%,rgba(0,216,245,.18) 0%,rgba(0,74,173,.10) 45%,rgba(0,0,0,0) 100%);pointer-events:none}
#lock .lbox{position:relative;width:100%;max-width:380px;padding:32px 28px;border-radius:24px;background:var(--surface-card);border:1px solid var(--border-default);box-shadow:var(--elev-card);display:grid;gap:10px}
#lock h1{font-size:24px;margin-top:10px}#lock p{font-size:14px;color:var(--text-muted)}
#lock form{margin-top:12px;display:grid;gap:12px}
#lock input[type=password]{height:46px;border-radius:12px;border:1px solid var(--border-default);background:rgba(5,7,10,.6);color:var(--text-strong);padding:0 14px;font:500 15px var(--sans)}
#lock input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
#lock label{font-size:13px;color:var(--text-muted);display:flex;gap:8px;align-items:center}
#lock button{height:46px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font:700 15px var(--sans);cursor:pointer;box-shadow:var(--glow-sm)}
#lock .err{color:var(--red);font-size:13px;min-height:18px}
</style>
</head>

<div id="lock"><div class="lbox">
  <div class="brand"><div class="ring">C2</div><div class="wordmark">C2Pro</div></div>
  <h1>Plano da Bárbara</h1>
  <p>Material privado da consultoria. Digite a senha que você recebeu.</p>
  <form id="f">
    <input type="password" id="s" placeholder="Senha" autocomplete="current-password" aria-label="Senha" autofocus>
    <label><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
    <button type="submit">Abrir</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div></div>
<div id="app" hidden></div>

function iniciar(){
  var slug=document.getElementById('root').dataset.slug||'plano';
  var KEY_TAB=slug+'-tab',KEY_CK=slug+'-checks';
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
  var tabs=[].slice.call(document.querySelectorAll('.tab')),panels=[].slice.call(document.querySelectorAll('.panel')),ids=panels.map(function(p){return p.id});
  function show(id,scroll){
    if(ids.indexOf(id)<0)id=ids[0];
    panels.forEach(function(p){p.hidden=p.id!==id});
    tabs.forEach(function(t){var on=t.dataset.tab===id;t.setAttribute('aria-selected',on?'true':'false');t.tabIndex=on?0:-1;if(on){try{t.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}catch(e){}}});
    store(KEY_TAB,id);try{history.replaceState(null,'','#'+id)}catch(e){}
    if(scroll){var bar=document.querySelector('.tabbar');var y=bar.getBoundingClientRect().top+window.scrollY;if(window.scrollY>y)window.scrollTo({top:y,behavior:'smooth'})}
  }
  tabs.forEach(function(t,i){
    t.addEventListener('click',function(){show(t.dataset.tab,true)});
    t.addEventListener('keydown',function(e){var j=null;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;if(j!==null){e.preventDefault();tabs[j].focus();show(tabs[j].dataset.tab,false)}});
  });
  document.querySelectorAll('[data-go]').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.go,true)})});
  show((location.hash||'').replace('#','')||store(KEY_TAB)||ids[0],false);
  var boxes=[].slice.call(document.querySelectorAll('.check input')),saved={};try{saved=JSON.parse(store(KEY_CK)||'{}')||{}}catch(e){}
  function upd(){var s={},n=0;boxes.forEach(function(b){if(b.checked){s[b.id]=1;n++}});store(KEY_CK,JSON.stringify(s));var t=document.getElementById('progTxt'),bar=document.getElementById('progBar');if(t)t.textContent=n+' de '+boxes.length;if(bar)bar.style.width=(boxes.length?Math.round(n/boxes.length*100):0)+'%'}
  boxes.forEach(function(b){b.checked=!!saved[b.id];b.addEventListener('change',upd)});upd();
  function flash(btn,txt){var old=btn.innerHTML;btn.textContent=txt;setTimeout(function(){btn.innerHTML=old},1800)}
  function selectEl(el){try{var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
  function copyText(text,btn,el){var done=function(){flash(btn,'Copiado')};var fail=function(){if(!el)return;selectEl(el);flash(btn,'Selecionado, copie manualmente')};try{navigator.clipboard.writeText(text).then(done,fail)}catch(e){fail()}}
  document.querySelectorAll('[data-copy]').forEach(function(btn){btn.addEventListener('click',function(){var el=document.getElementById(btn.dataset.copy);copyText([].slice.call(el.querySelectorAll('p')).map(function(p){return p.innerText.trim()}).join('\n\n'),btn,el)})});
  if(window.lucide&&lucide.createIcons){try{lucide.createIcons({attrs:{'stroke-width':2}})}catch(e){}}
}


var CHAVE='c2pro-plano-barbara-nunes';
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function decifrar(senha){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  var chave=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.sal),iterations:PAYLOAD.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var txt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},chave,b64(PAYLOAD.ct));
  return new TextDecoder().decode(txt);
}
function abrir(html){
  document.getElementById('app').innerHTML=html;
  var l=document.getElementById('lock');if(l)l.remove();
  document.getElementById('app').hidden=false;
  iniciar();
}
(async function(){
  if(window.PLAIN!==undefined){return abrir(window.PLAIN)}
  var salva=null;try{salva=localStorage.getItem(CHAVE)}catch(_){}
  if(salva){try{return abrir(await decifrar(salva))}catch(_){try{localStorage.removeItem(CHAVE)}catch(_){}}}
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var s=document.getElementById('s').value,err=document.getElementById('err');err.textContent='';
    try{var html=await decifrar(s);if(document.getElementById('lembrar').checked){try{localStorage.setItem(CHAVE,s)}catch(_){}}abrir(html)}
    catch(_){err.textContent='Senha incorreta. Confira e tente de novo.'}
  });
})();
