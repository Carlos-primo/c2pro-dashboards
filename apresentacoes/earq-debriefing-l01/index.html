<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Debriefing EARQ Mind</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-app:#05070a; --bg-deep:#030507; --surface-solid:#0a0e14;
  --text-strong:#f2f6fa; --text-body:#c9d2dd; --text-muted:#9aa6b6; --text-faint:#6b788a;
  --accent:#00d8f5; --accent-hover:#37e6ff; --text-on-accent:#00171c;
  --brand-blue:#004aad; --positive:#23d18b; --attention:#ffb020;
  --border-subtle:rgba(255,255,255,.07); --border-default:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.2); --border-accent:rgba(0,216,245,.45);
  --surface-card:linear-gradient(180deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.018) 100%);
  --grad-halo:radial-gradient(60% 60% at 50% 0%,rgba(0,216,245,.20) 0%,rgba(0,74,173,.10) 45%,rgba(0,0,0,0) 100%);
  --grad-hairline:linear-gradient(90deg,rgba(0,216,245,0) 0%,rgba(0,216,245,.75) 50%,rgba(0,216,245,0) 100%);
  --grad-ink:linear-gradient(180deg,#f2f6fa 0%,#9aa6b6 100%);
  --elev-card:0 12px 32px -8px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06);
  --elev-card-hover:0 28px 64px -16px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08),0 0 28px -10px rgba(0,216,245,.4);
  --glow-sm:0 0 12px -2px rgba(0,216,245,.45),0 0 2px rgba(0,216,245,.5);
  --glow-md:0 0 24px -4px rgba(0,216,245,.5),0 0 60px -12px rgba(0,216,245,.3);
  --glow-text-strong:0 0 8px rgba(0,216,245,.6),0 0 28px rgba(0,216,245,.4);
  --glow-positive:0 0 18px -4px rgba(35,209,139,.5);
  --t-hover:transform 160ms cubic-bezier(.2,.7,.2,1),box-shadow 160ms cubic-bezier(.2,.7,.2,1),border-color 160ms cubic-bezier(.2,.7,.2,1);
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-entrance:cubic-bezier(.16,1,.3,1);
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg-deep);color:var(--text-body);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;overflow:hidden}
#viewport{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;flex:none;background:var(--bg-app);overflow:hidden;border-radius:6px;box-shadow:0 40px 120px -30px rgba(0,0,0,.9)}
.slide{position:absolute;inset:0;padding:56px 88px 84px;display:flex;flex-direction:column;justify-content:center;opacity:0;visibility:hidden;transition:opacity 420ms var(--ease-out),visibility 0s 420ms}
.slide.on{opacity:1;visibility:visible;transition:opacity 420ms var(--ease-out),visibility 0s}
.slide::before{content:"";position:absolute;inset:0;background:var(--grad-halo);pointer-events:none}
.slide > *{position:relative}
.slide .rv{opacity:0;transform:translateY(14px)}
.slide.on .rv{animation:fadeUp 600ms var(--ease-entrance) forwards}
.slide.on .rv:nth-child(2){animation-delay:80ms}
.slide.on .rv:nth-child(3){animation-delay:160ms}
.slide.on .rv:nth-child(4){animation-delay:240ms}
.slide.on .rv:nth-child(5){animation-delay:320ms}
@keyframes fadeUp{to{opacity:1;transform:none}}

.eyebrow{font:600 12px/1.2 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:10px;margin-bottom:16px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:var(--glow-sm)}
.display{font-weight:800;letter-spacing:-.035em;line-height:1.02;font-size:80px;color:var(--text-strong)}
.h1{font-weight:700;letter-spacing:-.022em;line-height:1.1;font-size:44px;color:var(--text-strong);max-width:24ch}
.h1.sm{font-size:36px;max-width:42ch;margin-bottom:22px}
.lead{font-size:22px;line-height:1.45;color:var(--text-muted);max-width:44ch;margin-top:26px}
.key{color:var(--accent-hover);text-shadow:var(--glow-text-strong)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.src{font-size:13px;line-height:1.5;color:var(--text-faint);margin-top:18px;max-width:110ch}
.plabel{font:600 11px/1.2 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}
b{color:var(--text-strong);font-weight:600}

.card{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:18px;box-shadow:var(--elev-card);padding:22px;transition:var(--t-hover)}
.card:hover{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:var(--elev-card-hover)}
.card.accent{border-color:var(--border-accent);box-shadow:var(--elev-card),var(--glow-md)}
.card.attn{background:linear-gradient(180deg,rgba(255,176,32,.10),rgba(255,176,32,.04)),var(--surface-solid);border-color:rgba(255,176,32,.35)}
.ico{width:20px;height:20px;color:var(--accent);flex:none}
.card.warn .ico,.card.attn .ico{color:var(--attention)}
.card.mini{padding:18px 20px}
.card.mini .ct{display:flex;align-items:center;gap:10px}
.card.mini h3{font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--text-strong);line-height:1.25}
.card.mini p{font-size:14.5px;line-height:1.45;color:var(--text-muted);margin-top:8px}

.foot{position:absolute;left:88px;right:88px;bottom:28px;display:flex;align-items:center;gap:16px;font:500 11px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);z-index:3}
.foot .brand{display:flex;align-items:center;gap:10px;color:var(--text-muted)}
.foot img{height:20px;width:20px}
.foot .pg{padding-left:16px;border-left:1px solid var(--border-default)}
.foot .tag{padding-left:16px;border-left:1px solid var(--border-default)}

/* capa */
.s-capa .display{margin-top:6px}
.capa-meta{display:flex;gap:12px;margin-top:40px}
.pill{padding:10px 18px;border-radius:999px;border:1px solid var(--border-default);background:rgba(10,14,20,.6);font-size:13px;color:var(--text-body)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.kpis.k4{grid-template-columns:repeat(4,1fr);margin-top:6px}
.metric .v{font-weight:600;font-size:40px;line-height:1;color:var(--text-strong);letter-spacing:-.02em}
.metric .l{margin-top:12px;font:500 11px/1.3 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.metric.hl{border-color:var(--border-accent);box-shadow:var(--elev-card),var(--glow-md)}
.metric.hl .v{color:var(--accent-hover);text-shadow:var(--glow-text-strong)}

/* metas */
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}
.goal .gl{font:600 11px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.goal .gv{font-size:64px;font-weight:600;line-height:1;margin-top:16px;color:var(--text-strong);letter-spacing:-.03em}
.goal.win .gv{color:var(--positive);text-shadow:var(--glow-positive)}
.goal .gm{margin-top:12px;font-size:14px;color:var(--text-muted);display:flex;gap:10px;align-items:center}
.pct{font:600 12px/1 var(--font-mono);padding:5px 8px;border-radius:999px;background:rgba(35,209,139,.12);color:var(--positive)}
.pct.warn{background:rgba(255,176,32,.12);color:var(--attention)}
.meter{height:6px;border-radius:999px;background:rgba(255,255,255,.07);margin-top:18px;overflow:hidden}
.meter div{height:100%;border-radius:999px;background:var(--accent)}
.goal.win .meter div{background:var(--positive)}

/* linha do tempo */
.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:30px;position:relative}
.tl-line{position:absolute;left:0;right:0;top:-14px;height:1px;background:var(--grad-hairline)}
.tl-item{padding:18px}
.tl-d{font-size:12px;color:var(--accent)}
.tl-item h3{font-size:19px;color:var(--text-strong);margin-top:10px;letter-spacing:-.01em}
.tl-item p{font-size:14px;line-height:1.45;color:var(--text-muted);margin-top:8px}

/* gráficos */
.chart text,.daily text{font-family:var(--font-mono)}
.bar{fill:var(--accent);opacity:.82;transition:opacity 120ms}
.bar:hover{opacity:1}
.bar.hi{opacity:1}
.zero{fill:var(--attention)}
.axis{stroke:rgba(255,255,255,.18);stroke-width:1}
.ref{stroke:var(--positive);stroke-width:2;stroke-dasharray:6 6}
.reflabel{fill:var(--positive);font-size:13px}
.val{fill:var(--text-strong);font-size:12px}
.val.big{font-size:18px;font-weight:600}
.xl{fill:var(--text-muted);font-size:13px}
.xl.price{fill:var(--text-strong);font-weight:600}
.xl.note{fill:var(--text-faint);font-size:11px}
.band{fill:rgba(0,216,245,.06)}
.band.b2{fill:rgba(255,255,255,.05)}
.wf.in{fill:var(--accent)}
.wf.out{fill:rgba(154,166,182,.45)}
.wf.res{fill:var(--positive)}
.wf:hover{filter:brightness(1.15)}
.conn{stroke:rgba(255,255,255,.25);stroke-dasharray:3 4}
.daily{display:flex;flex-direction:column;gap:10px}
.panel svg{display:block;overflow:visible}
.xticks{position:relative;height:16px;font:500 12px/1 var(--font-mono);color:var(--text-muted)}
.xticks span{position:absolute;transform:translateX(-50%)}
.bandkey{display:flex;gap:24px;font-size:13px;color:var(--text-muted);margin-top:4px}
.bandkey i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle}
.bandkey .k1{background:rgba(0,216,245,.25)}
.bandkey .k2{background:rgba(255,255,255,.18)}

.split{display:grid;grid-template-columns:1.25fr 1fr;gap:36px;align-items:center}
.split.two{grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.side{display:flex;flex-direction:column;gap:14px}

.hbars{display:flex;flex-direction:column;gap:12px}
.hrow{display:grid;grid-template-columns:170px auto 1fr;gap:14px;align-items:center}
.hname{font-size:14px;color:var(--text-body);line-height:1.25}
.htrack{height:22px;border-radius:6px;background:rgba(255,255,255,.04)}
.hbar{height:100%;border-radius:0 6px 6px 0;background:var(--accent);opacity:.75;transition:opacity 120ms}
.hrow:hover .hbar,.hbar.hi{opacity:1}
.hval{font-size:15px;color:var(--text-strong);white-space:nowrap}

/* funil */
.funnel{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.frow{display:grid;grid-template-columns:760px 1fr;align-items:center;gap:20px}
.fbar{width:var(--w);height:44px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:linear-gradient(90deg,rgba(0,216,245,.20),rgba(0,74,173,.18));border:1px solid rgba(0,216,245,.25);transition:var(--t-hover)}
.frow:hover .fbar{border-color:var(--border-accent);box-shadow:var(--glow-sm)}
.frow:last-child .fbar{background:linear-gradient(90deg,rgba(0,216,245,.45),rgba(0,74,173,.35));border-color:var(--border-accent)}
.fn{font-size:15px;color:var(--text-strong)}
.fv{font-size:17px;font-weight:600;color:var(--text-strong)}
.fr{font-size:13px;color:var(--text-muted)}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.lessons{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lessons li{display:flex;gap:14px;align-items:flex-start;padding:16px 20px;font-size:15.5px;line-height:1.45;color:var(--text-body)}
.lessons .n{color:var(--accent);font-size:14px;font-weight:600;padding-top:2px}

.s-int::before{background:radial-gradient(60% 60% at 50% 0%,rgba(255,176,32,.10) 0%,rgba(0,74,173,.08) 45%,rgba(0,0,0,0) 100%)}
.s-int .eyebrow{color:var(--attention)}
.s-int .eyebrow::before{background:var(--attention);box-shadow:none}

#progress{position:absolute;left:0;bottom:0;height:2px;background:var(--grad-hairline);transition:width 420ms var(--ease-out);z-index:5;box-shadow:0 0 10px rgba(0,216,245,.6)}
#controls{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px;z-index:10;opacity:.55;transition:opacity 200ms}
#controls:hover{opacity:1}
#controls button{width:44px;height:44px;border-radius:12px;border:1px solid var(--border-default);background:rgba(10,14,20,.75);color:var(--text-strong);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(14px);transition:var(--t-hover)}
#controls button:hover{transform:translateY(-2px);border-color:var(--border-strong)}
#controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#controls svg{width:18px;height:18px}
#prev svg{transform:scaleX(-1)}
#notes{position:fixed;left:16px;right:16px;bottom:72px;max-width:760px;margin:0 auto;padding:18px 22px;border-radius:18px;background:rgba(10,14,20,.94);border:1px solid var(--border-default);font-size:16px;line-height:1.55;color:var(--text-body);z-index:9;display:none}
#notes.show{display:block}
#notes .t{font:600 11px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
#tip{position:fixed;z-index:20;pointer-events:none;padding:8px 12px;border-radius:10px;background:rgba(10,14,20,.96);border:1px solid var(--border-strong);font:500 13px/1.4 var(--font-mono);color:var(--text-strong);box-shadow:var(--elev-card);opacity:0;transition:opacity 100ms;max-width:360px}
#tip.on{opacity:1}
#rotate{position:fixed;left:0;right:0;top:max(16px,env(safe-area-inset-top));text-align:center;font:500 11px/1.4 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);display:none;padding:0 16px}
@media (orientation:portrait) and (max-width:700px){#rotate{display:block}}

/* senha */
#lock{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--bg-app);z-index:30}
#lock::before{content:"";position:absolute;inset:0;background:var(--grad-halo);pointer-events:none}
#lock .box{position:relative;width:100%;max-width:380px;padding:32px 28px;border-radius:24px;background:var(--surface-card);border:1px solid var(--border-default);box-shadow:var(--elev-card);text-align:left}
#lock img{width:36px;height:36px}
#lock h1{font-size:22px;font-weight:700;color:var(--text-strong);letter-spacing:-.02em;margin-top:18px}
#lock p{font-size:14px;line-height:1.5;color:var(--text-muted);margin-top:8px}
#lock form{margin-top:22px;display:flex;flex-direction:column;gap:12px}
#lock input[type=password]{height:46px;border-radius:12px;border:1px solid var(--border-default);background:rgba(5,7,10,.6);color:var(--text-strong);padding:0 14px;font:500 15px var(--font-sans)}
#lock input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
#lock label{font-size:13px;color:var(--text-muted);display:flex;gap:8px;align-items:center}
#lock button{height:46px;border-radius:12px;border:0;background:var(--accent);color:var(--text-on-accent);font:700 15px var(--font-sans);cursor:pointer;box-shadow:var(--glow-sm);transition:var(--t-hover)}
#lock button:hover{transform:translateY(-2px);box-shadow:var(--glow-md)}
#lock .err{color:#ff4d5e;font-size:13px;min-height:18px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}
  .card:hover,#controls button:hover{transform:none}
}
</style>
</head>
<body>

<div id="lock"><div class="box">
  <img src="logo.png" alt="C2Pro">
  <h1>Debriefing EARQ Mind</h1>
  <p>Apresentação privada. Digite a senha que você recebeu.</p>
  <form id="f">
    <input type="password" id="s" placeholder="Senha" autocomplete="current-password" aria-label="Senha" autofocus>
    <label><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
    <button type="submit">Abrir</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div></div>
<div id="app" hidden><div id="viewport"><div id="stage"><div id="progress"></div></div></div>
<div id="notes"><div class="t">Roteiro</div><div class="b"></div></div>
<div id="tip"></div>
<div id="controls">
  <button id="prev" aria-label="Slide anterior"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
  <button id="next" aria-label="Próximo slide"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
  <button id="full" aria-label="Tela cheia"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>

function iniciar(){
  var stage=document.getElementById('stage');
  var slides=[].slice.call(stage.querySelectorAll('.slide'));
  var total=slides.length, cur=0;
  var notes=document.getElementById('notes'), notesB=notes.querySelector('.b');
  var progress=document.getElementById('progress');
  var tip=document.getElementById('tip');
  function pad(n){return (n<10?'0':'')+n}
  slides.forEach(function(s,i){var pg=s.querySelector('.pg'); if(pg) pg.textContent=pad(i+1)+' / '+pad(total);});
  function fit(){var s=Math.min(window.innerWidth/1280,window.innerHeight/720); stage.style.transform='scale('+s+')';}
  window.addEventListener('resize',fit); fit();
  function go(i){
    i=Math.max(0,Math.min(total-1,i));
    slides[cur].classList.remove('on'); cur=i; slides[cur].classList.add('on');
    progress.style.width=((cur+1)/total*100)+'%';
    notesB.textContent=slides[cur].getAttribute('data-notes')||'';
    tip.classList.remove('on');
    try{history.replaceState(null,'','#'+(cur+1))}catch(e){}
  }
  var start=parseInt((location.hash||'').replace('#',''),10);
  go(isNaN(start)?0:start-1);
  if(/[?&]roteiro/.test(location.search)) notes.classList.add('show');
  function full(){
    var d=document, el=d.documentElement;
    if(!d.fullscreenElement && !d.webkitFullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el)}
    else{(d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d)}
  }
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){e.preventDefault();go(cur+1)}
    else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();go(cur-1)}
    else if(k==='Home'){go(0)} else if(k==='End'){go(total-1)}
    else if(k==='f'||k==='F'){full()}
    else if(k==='n'||k==='N'){notes.classList.toggle('show')}
  });
  document.getElementById('prev').addEventListener('click',function(e){e.stopPropagation();go(cur-1)});
  document.getElementById('next').addEventListener('click',function(e){e.stopPropagation();go(cur+1)});
  document.getElementById('full').addEventListener('click',function(e){e.stopPropagation();full()});
  document.getElementById('viewport').addEventListener('click',function(e){
    if(e.target.closest('a,button,[data-tip]')) return;
    if(e.clientX<window.innerWidth*0.33) go(cur-1); else go(cur+1);
  });
  var x0=null,y0=null;
  document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  document.addEventListener('touchend',function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){go(dx<0?cur+1:cur-1)}
    x0=null;
  },{passive:true});
  stage.addEventListener('mousemove',function(e){
    var t=e.target.closest('[data-tip]');
    if(!t){tip.classList.remove('on');return}
    tip.textContent=t.getAttribute('data-tip');
    var x=e.clientX+14, y=e.clientY+14;
    if(x+tip.offsetWidth>window.innerWidth-8) x=e.clientX-tip.offsetWidth-14;
    if(y+tip.offsetHeight>window.innerHeight-8) y=e.clientY-tip.offsetHeight-14;
    tip.style.left=x+'px'; tip.style.top=y+'px'; tip.classList.add('on');
  });
  stage.addEventListener('mouseleave',function(){tip.classList.remove('on')});
}

var CHAVE='c2pro-earq-debriefing-l01';
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function decifrar(senha){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  var chave=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.sal),iterations:PAYLOAD.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var txt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},chave,b64(PAYLOAD.ct));
  return new TextDecoder().decode(txt);
}
function abrir(html){
  document.getElementById('stage').insertAdjacentHTML('afterbegin',html);
  document.getElementById('lock').remove();
  document.getElementById('app').hidden=false;
  iniciar();
}
