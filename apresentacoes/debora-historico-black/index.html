<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Histórico e Black</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070A;--t-strong:#F2F6FA;--t-muted:#9AA6B6;--accent:#00D8F5;--on-accent:#00171C;--b-def:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
#lock{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--bg)}
#lock::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 0%,rgba(0,216,245,.22) 0%,rgba(0,74,173,.10) 45%,rgba(0,0,0,0) 100%);pointer-events:none}
.box{position:relative;width:100%;max-width:380px;padding:32px 28px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.018) 100%);border:1px solid var(--b-def);box-shadow:0 12px 32px -8px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06)}
.box img{width:36px;height:36px}
.box h1{font-size:22px;font-weight:700;color:var(--t-strong);letter-spacing:-.02em;margin-top:18px}
.box p{font-size:14px;line-height:1.5;color:var(--t-muted);margin-top:8px}
form{margin-top:22px;display:flex;flex-direction:column;gap:12px}
input[type=password]{height:46px;border-radius:12px;border:1px solid var(--b-def);background:rgba(5,7,10,.6);color:var(--t-strong);padding:0 14px;font:500 15px "Inter",sans-serif}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
label{font-size:13px;color:var(--t-muted);display:flex;gap:8px;align-items:center}
button{height:46px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font:700 15px "Inter",sans-serif;cursor:pointer;box-shadow:0 0 12px -2px rgba(0,216,245,.45),0 0 2px rgba(0,216,245,.5);transition:transform 160ms cubic-bezier(.2,.7,.2,1),box-shadow 160ms cubic-bezier(.2,.7,.2,1)}
button:hover{transform:translateY(-2px);box-shadow:0 0 24px -4px rgba(0,216,245,.5),0 0 60px -12px rgba(0,216,245,.3)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:#FF4D5E;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <img src="logo.png" alt="C2Pro">
  <h1>Histórico e Black</h1>
  <p>Apresentação privada. Digite a senha que você recebeu.</p>
  <form id="f">
    <input type="password" id="s" placeholder="Senha" autocomplete="current-password" aria-label="Senha" autofocus>
    <label><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
    <button type="submit">Abrir</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div></div>

var CHAVE='c2pro-debora-historico-black';
function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function abrirCom(senha){
  var mat=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(PAYLOAD.sal),iterations:PAYLOAD.iter,hash:'SHA-256'},mat,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(PAYLOAD.iv)},k,b(PAYLOAD.ct));
  return new TextDecoder().decode(pt);
}
function mostrar(html){document.open();document.write(html);document.close();}
(async function(){
  var salva=null; try{salva=localStorage.getItem(CHAVE)}catch(e){}
  if(salva){try{mostrar(await abrirCom(salva));return}catch(e){try{localStorage.removeItem(CHAVE)}catch(e2){}}}
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var senha=document.getElementById('s').value, err=document.getElementById('err');
    err.textContent='Abrindo...';
    try{
      var html=await abrirCom(senha);
      if(document.getElementById('lembrar').checked){try{localStorage.setItem(CHAVE,senha)}catch(e){}}
      mostrar(html);
    }catch(x){err.textContent='Senha incorreta.';}
  });
})();
