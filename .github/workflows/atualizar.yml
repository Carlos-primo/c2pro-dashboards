# Atualiza os dashboards todo dia de madrugada (Brasilia) e publica no GitHub Pages, em tres grupos
# separados por 1 hora pra nao dividir o limite de chamadas da Meta (janela movel de 1 hora):
#   02:00 distribuicao | 03:00 vendas e Black | 04:00 leads e lancamento
# Nao usa Claude: e so o gerar*.py chamando a API da Meta.
#
# Na hora (botao "Run workflow" ou o botao "Atualizar agora" do dashboard, via n8n):
#   dashboard = caminho de um so (ex: vendas/vita-hair, black/wescley, clientes/c2pro)
#   grupo     = todos | distribuicao | vendas | leads (vale quando dashboard fica vazio)
# O que nao e gerado na rodada continua no ar com a ultima versao publicada.
#
# Secret necessario (Settings > Secrets and variables > Actions): META_ADS_TOKEN
# Opcional por cliente: SENHA_<SLUG> (ex: SENHA_C2PRO) pra proteger aquele dashboard com senha.
# Dashboards de vendas: SENHA_VENDAS_<SLUG>, no bloco env do passo "Gerar dashboards de vendas".
# Dashboards da Black: SENHA_BLACK_<SLUG>, no bloco env do passo "Gerar dashboards da Black".
# Dashboards de leads: SENHA_LEADS_<SLUG>, no bloco env do passo "Gerar dashboards de leads".
# Dashboards de lancamento: SENHA_LANCAMENTO_<SLUG>, no bloco env do passo "Gerar dashboards de lancamento".

name: Atualizar dashboards
# O n8n le esse titulo pra nao pedir o mesmo dashboard duas vezes em poucos minutos.
run-name: ${{ inputs.dashboard && format('Atualizar {0}', inputs.dashboard) || 'Atualizar dashboards' }}

on:
  schedule:
    - cron: "0 5 * * *"   # 02:00 em Brasilia: distribuicao
    - cron: "0 6 * * *"   # 03:00 em Brasilia: vendas e Black
    - cron: "0 7 * * *"   # 04:00 em Brasilia: leads e lancamento
  workflow_dispatch:
    inputs:
      dashboard:
        description: "So um dashboard (ex: vendas/vita-hair). Vazio = usa o grupo"
        required: false
        default: ""
      grupo:
        description: "Grupo quando o dashboard fica vazio"
        type: choice
        options: [todos, distribuicao, vendas, leads]
        default: todos

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write           # pro passo que mantem o agendamento ativo

# Fila, sem cancelar: cada rodada copia a versao publicada dos outros dashboards,
# entao duas rodadas ao mesmo tempo apagariam a atualizacao uma da outra.
concurrency:
  group: dashboards
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    # Um gerador com erro nao trava os outros (continue-on-error); o job publicar marca a execucao como falha no fim.
    outputs:
      falhou: ${{ steps.distribuicao.outcome == 'failure' || steps.vendas.outcome == 'failure' || steps.black.outcome == 'failure' || steps.leads.outcome == 'failure' || steps.lancamento.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v5

      # Saida por tipo: vazio = nao roda, "todos" = todos daquele tipo, ou o slug de um so.
      - name: Definir o que gerar
        id: alvo
        env:
          DASHBOARD: ${{ inputs.dashboard }}
          GRUPO: ${{ inputs.grupo }}
          AGENDA: ${{ github.event.schedule }}
        run: |
          case "$AGENDA" in
            "0 5 * * *") GRUPO=distribuicao ;;
            "0 6 * * *") GRUPO=vendas ;;
            "0 7 * * *") GRUPO=leads ;;
          esac
          declare -A tipo=([distribuicao]= [vendas]= [black]= [leads]= [lancamento]=)
          if [ -n "$DASHBOARD" ]; then
            caminho="${DASHBOARD#/}"; caminho="${caminho%/}"
            case "$caminho" in */*) ;; *) caminho="clientes/$caminho" ;; esac
            if ! [[ "$caminho" =~ ^(clientes|vendas|black|leads|lancamento)/[a-z0-9-]+$ ]] || [ ! -f "$caminho/config.json" ]; then
              echo "::error::dashboard '$DASHBOARD' nao existe"; exit 1
            fi
            pasta="${caminho%%/*}"; [ "$pasta" = clientes ] && pasta=distribuicao
            tipo[$pasta]="${caminho#*/}"
          else
            case "${GRUPO:-todos}" in
              distribuicao) tipo[distribuicao]=todos ;;
              vendas) tipo[vendas]=todos; tipo[black]=todos ;;
              leads) tipo[leads]=todos; tipo[lancamento]=todos ;;
              *) for t in "${!tipo[@]}"; do tipo[$t]=todos; done ;;
            esac
          fi
          for t in "${!tipo[@]}"; do echo "$t=${tipo[$t]}" >> "$GITHUB_OUTPUT"; echo "$t: ${tipo[$t]:-(nao roda)}"; done

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gerar dashboards
        id: distribuicao
        if: steps.alvo.outputs.distribuicao != ''
        continue-on-error: true
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          SENHA_C2PRO: ${{ secrets.SENHA_C2PRO }}
          ALVO: ${{ steps.alvo.outputs.distribuicao }}
        run: if [ "$ALVO" = todos ]; then python gerar.py; else python gerar.py "$ALVO"; fi

      - name: Gerar dashboards de vendas
        id: vendas
        if: steps.alvo.outputs.vendas != ''
        continue-on-error: true
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          ALVO: ${{ steps.alvo.outputs.vendas }}
        run: if [ "$ALVO" = todos ]; then python gerar_vendas.py; else python gerar_vendas.py "$ALVO"; fi

      - name: Gerar dashboards da Black
        id: black
        if: steps.alvo.outputs.black != ''
        continue-on-error: true
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          ALVO: ${{ steps.alvo.outputs.black }}
        run: if [ "$ALVO" = todos ]; then python gerar_black.py; else python gerar_black.py "$ALVO"; fi

      - name: Gerar dashboards de leads
        id: leads
        if: steps.alvo.outputs.leads != ''
        continue-on-error: true
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          ALVO: ${{ steps.alvo.outputs.leads }}
        run: if [ "$ALVO" = todos ]; then python gerar_leads.py; else python gerar_leads.py "$ALVO"; fi

      - name: Gerar dashboards de lancamento
        id: lancamento
        if: steps.alvo.outputs.lancamento != ''
        continue-on-error: true
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          ALVO: ${{ steps.alvo.outputs.lancamento }}
        run: if [ "$ALVO" = todos ]; then python gerar_lancamento.py; else python gerar_lancamento.py "$ALVO"; fi

      # O Pages troca o site inteiro a cada publicacao: dashboard que nao foi gerado nesta rodada sumiria do ar.
      # Volta a ultima versao publicada dele (o ?t= fura o cache do Pages). So avisa se era pra ter sido gerado.
      - name: Manter no ar a ultima versao dos que nao foram gerados
        env:
          ALVO_DISTRIBUICAO: ${{ steps.alvo.outputs.distribuicao }}
          ALVO_VENDAS: ${{ steps.alvo.outputs.vendas }}
          ALVO_BLACK: ${{ steps.alvo.outputs.black }}
          ALVO_LEADS: ${{ steps.alvo.outputs.leads }}
          ALVO_LANCAMENTO: ${{ steps.alvo.outputs.lancamento }}
        run: |
          for cfg in clientes/*/config.json vendas/*/config.json black/*/config.json leads/*/config.json lancamento/*/config.json; do
            dir=$(dirname "$cfg"); slug=$(basename "$dir"); tipo=$(dirname "$dir")
            if [ "$tipo" = clientes ]; then destino="$slug"; var=ALVO_DISTRIBUICAO; else destino="$tipo/$slug"; var="ALVO_${tipo^^}"; fi
            [ -f "site/$destino/index.html" ] && continue
            alvo="${!var}"; [ "$alvo" = todos ] || [ "$alvo" = "$slug" ] && falhou=1 || falhou=0
            mkdir -p "site/$destino"
            if curl -sfL "https://carlos-primo.github.io/c2pro-dashboards/$destino/?t=$(date +%s)" -o "site/$destino/index.html"; then
              cp logo.png "site/$destino/logo.png"
              [ $falhou = 1 ] && echo "::warning::$destino nao foi gerado; ficou no ar a ultima versao publicada"
            else
              rm -rf "site/$destino"
              [ $falhou = 1 ] && echo "::warning::$destino nao foi gerado e nao tinha versao publicada"
            fi
          done
          true

      # Paginas estaticas (planejamentos, relatorios fechados de cliente e apresentacoes): so copiar pro site.
      - name: Copiar planejamentos
        run: mkdir -p site && cp -r planejamento site/planejamento

      - name: Copiar relatorios
        run: mkdir -p site && cp -r relatorios site/relatorios

      - name: Copiar apresentacoes
        run: mkdir -p site && cp -r apresentacoes site/apresentacoes

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # Repositorio publico: o GitHub desliga agendamentos apos 60 dias sem commit.
      # Reativar o workflow a cada execucao evita isso.
      - name: Manter agendamento ativo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/atualizar.yml/enable"

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Avisar se algum gerador falhou
        if: needs.gerar.outputs.falhou == 'true'
        run: |
          echo "::error::Algum gerador falhou. Os outros dashboards foram publicados; ver o job gerar."
          exit 1
