<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Funis C2Pro</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070A; --bg-deep:#030507; --solid:#0A0E14;
  --s1:rgba(255,255,255,.028); --s2:rgba(255,255,255,.048);
  --b-sub:rgba(255,255,255,.07); --b-def:rgba(255,255,255,.12); --b-strong:rgba(255,255,255,.2); --b-acc:rgba(0,216,245,.45);
  --t-strong:#F2F6FA; --t-body:#C9D2DD; --t-muted:#9AA6B6; --t-faint:#6B788A;
  --acc:#00D8F5; --acc-h:#37E6FF; --on-acc:#00171C; --acc-soft:rgba(0,216,245,.12);
  --pos:#23D18B; --neg:#FF4D5E;
  --grid:rgba(255,255,255,.07);
  --card:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  --elev:0 12px 32px -8px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06);
  --glow:0 0 24px -4px rgba(0,216,245,.5),0 0 60px -12px rgba(0,216,245,.3);
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(900px 500px at 85% -10%,rgba(0,74,173,.22),transparent 60%),
             radial-gradient(700px 400px at 0% 0%,rgba(0,216,245,.07),transparent 60%),var(--bg);
  background-attachment:fixed;
  color:var(--t-body);font:400 15px/1.55 Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
.wrap{max-width:1200px;margin:0 auto;padding:32px 16px 64px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
h1{margin:10px 0 6px;font-weight:800;font-size:clamp(28px,5vw,40px);letter-spacing:-.035em;line-height:1.1;
  background:linear-gradient(180deg,#F2F6FA,#9AA6B6);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 4px;font-weight:700;font-size:20px;letter-spacing:-.022em;color:var(--t-strong)}
.sub{color:var(--t-muted);font-size:14px;margin:0}
section{margin-top:40px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.brand{display:flex;gap:16px;align-items:center}
.brand img{width:52px;height:52px;object-fit:contain}
.pills{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;padding:4px;border:1px solid var(--b-def);border-radius:999px;background:var(--s1)}
.pills button{all:unset;cursor:pointer;white-space:nowrap;flex:none;padding:8px 16px;border-radius:999px;font:500 13px/1 Inter,sans-serif;color:var(--t-muted);transition:.15s}
.pills button:hover{color:var(--t-strong)}
.pills button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);box-shadow:0 0 12px -2px rgba(0,216,245,.45)}
.pills button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.meta{margin-top:14px;display:flex;gap:8px 20px;flex-wrap:wrap;font:400 12px/1.4 var(--mono);color:var(--t-faint)}

.card{background:var(--card);border:1px solid var(--b-sub);border-radius:18px;box-shadow:var(--elev)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.tile{padding:20px;container-type:inline-size;min-width:0}
.tile.hero{border-color:var(--b-acc);box-shadow:var(--elev),var(--glow)}
.tile .lbl{font-size:13px;color:var(--t-muted);margin-bottom:10px}
.tile .val{font:600 clamp(14px,calc(100cqi / (var(--n,8) * .62)),24px)/1.1 var(--mono);font-variant-numeric:tabular-nums;color:var(--t-strong);letter-spacing:-.02em;white-space:nowrap}
.tile.hero .val{color:var(--acc-h)}
.tile .extra{margin-top:8px;font:400 12px/1.4 var(--mono);color:var(--t-muted)}
.delta{display:inline-block;margin-top:10px;font:500 12px/1 var(--mono);color:var(--t-faint)}
.delta.pos{color:var(--pos)} .delta.neg{color:var(--neg)}
.delta span{color:var(--t-faint);font-weight:400}

/* ---------- funil ---------- */
.funil{padding:28px 24px 24px}
.fn-cols{display:grid;grid-template-columns:200px minmax(0,1fr) 200px;gap:0 24px;margin-bottom:10px;
  font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--t-faint)}
.fn-cols div:last-child{text-align:right}
.fn-row{display:grid;grid-template-columns:200px minmax(0,1fr) 200px;grid-template-areas:"nome forma custo";gap:0 24px;align-items:center}
.fn-nome{grid-area:nome}
.fn-nome .n{color:var(--t-strong);font-weight:600;font-size:15px;line-height:1.3}
.fn-nome .d{color:var(--t-faint);font-size:12px;line-height:1.4;margin-top:2px}
.fn-forma{grid-area:forma;position:relative;height:72px}
.fn-forma svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fn-forma .q{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.fn-forma .q b{font:600 24px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--t-strong);letter-spacing:-.02em}
.fn-forma .q span{font:400 11px/1.2 var(--mono);color:var(--t-muted)}
.fn-row.fim .fn-forma .q b{color:var(--acc-h);text-shadow:0 0 18px rgba(0,216,245,.45)}
.fn-custo{grid-area:custo;text-align:right}
.fn-custo .l{font-size:12px;color:var(--t-muted)}
.fn-custo .v{font:600 18px/1.2 var(--mono);font-variant-numeric:tabular-nums;color:var(--t-strong);margin-top:2px}
.fn-row.fim .fn-custo .v{color:var(--acc-h)}
.fn-custo .delta{margin-top:4px}
.fn-conn{display:grid;grid-template-columns:200px minmax(0,1fr) 200px;gap:0 24px;align-items:center;min-height:52px}
.fn-conn .chip{grid-column:2;justify-self:center;display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  padding:6px 14px;border-radius:999px;border:1px solid var(--b-def);background:var(--solid);font:400 12px/1.3 var(--mono);color:var(--t-muted)}
.fn-conn .chip b{color:var(--t-strong);font-weight:600;font-size:14px}
.fn-conn .chip .k{font-family:Inter,sans-serif;font-weight:500;color:var(--t-body)}
.fn-conn .chip .delta{margin:0}
.fn-conn .chip svg{width:14px;height:14px;color:var(--acc)}
.fn-conn .chip.pior{border-color:rgba(255,77,94,.45)}
.fn-conn .nota{grid-column:3;text-align:right;font:400 11px/1.4 var(--mono);color:var(--t-faint)}
.fn-rodape{margin-top:24px;padding-top:18px;border-top:1px solid var(--b-sub);display:flex;flex-wrap:wrap;gap:12px 32px;font:400 12px/1.5 var(--mono);color:var(--t-muted)}
.fn-rodape b{color:var(--t-strong);font-weight:600}
.alerta{margin-top:16px;display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid var(--b-def);background:var(--s1);font-size:14px;color:var(--t-body)}
.alerta svg{flex:none;width:16px;height:16px;margin-top:3px;color:var(--neg)}
.alerta b{color:var(--t-strong)}
/* so_dados: dashboard só com números, sem textos explicativos nem sugestões */
.so-dados .sub,.so-dados .fn-nome .d,.so-dados .alerta,.so-dados footer{display:none}

.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.chart{padding:20px 20px 12px;position:relative}
.chart h3{margin:0;font:600 15px/1.3 Inter,sans-serif;color:var(--t-strong)}
.chart .tot{font:400 12px/1.4 var(--mono);color:var(--t-muted);margin:4px 0 12px}
.chart svg{display:block;width:100%;height:200px;overflow:visible}
.axis{font:400 10px var(--mono);fill:var(--t-faint)}
.tip{position:absolute;pointer-events:none;background:var(--solid);border:1px solid var(--b-def);border-radius:10px;
  padding:8px 10px;font:400 12px/1.45 var(--mono);color:var(--t-body);white-space:nowrap;box-shadow:0 4px 16px -4px rgba(0,0,0,.6);
  opacity:0;transition:opacity .1s;z-index:5}
.tip b{color:var(--t-strong);font-weight:600}
details{margin-top:14px}
summary{cursor:pointer;color:var(--t-muted);font-size:13px}
summary:hover{color:var(--acc-h)}

.tbl-wrap{overflow-x:auto;border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:500 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--t-faint);text-align:right;padding:14px 10px;border-bottom:1px solid var(--b-def);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--b-sub);text-align:right;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--t-body)}
th:first-child,td:first-child{text-align:left}
td:first-child{font-family:Inter,sans-serif;color:var(--t-strong);white-space:normal;min-width:200px;padding-left:16px}
td.dia{min-width:0;white-space:nowrap;font-family:var(--mono)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--s1)}
td.hl{color:var(--acc-h)}
.badge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font:500 10px/1.6 var(--mono);letter-spacing:.06em;border:1px solid var(--b-def);color:var(--t-muted);vertical-align:1px}
.badge.on{border-color:var(--b-acc);color:var(--acc-h);background:var(--acc-soft)}

.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.ad{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:16px;align-items:start}
.ad .thumb{position:relative;display:block;width:96px;height:128px;border-radius:12px;overflow:hidden;background:var(--s2);border:1px solid var(--b-sub)}
.ad .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ad .rank{position:absolute;top:6px;left:6px;min-width:24px;padding:2px 6px;border-radius:999px;background:rgba(5,7,10,.8);
  border:1px solid var(--b-def);font:600 11px/1.4 var(--mono);color:var(--t-strong);text-align:center}
.ad .nm{color:var(--t-strong);font-weight:600;font-size:14px;line-height:1.3;word-break:break-word}
.ad .cp{color:var(--t-faint);font-size:12px;margin:2px 0 10px;word-break:break-word}
.ad .kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font:400 12px/1.35 var(--mono);color:var(--t-muted)}
.ad .kpis b{display:block;color:var(--t-strong);font-weight:500;font-size:13px}
.ad .kpis .sel b{color:var(--acc-h)}
.mini{grid-column:1/-1;margin-top:6px}
.mini-bar{display:flex;gap:3px;height:6px;margin-top:6px}
.mini-bar i{flex:1;border-radius:3px;background:var(--s2);position:relative;overflow:hidden}
.mini-bar i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--acc);border-radius:3px}
.mini-lbl{display:flex;justify-content:space-between;gap:3px;font:400 10px/1.3 var(--mono);color:var(--t-faint);margin-top:4px}
.mini-lbl span{flex:1;text-align:center}
.ad .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lnk{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--b-def);
  color:var(--t-body);font:500 12px/1.2 Inter,sans-serif;text-decoration:none;transition:.15s}
.lnk:hover{border-color:var(--b-acc);color:var(--acc-h);background:var(--acc-soft)}
.lnk svg{width:14px;height:14px}
.lnk:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.empty{padding:24px;color:var(--t-muted);font-size:14px}

/* ---------- Hotmart ---------- */
.origens{padding:8px 20px}
.origem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--b-sub)}
.origem:last-child{border-bottom:0}
.origem .nm{color:var(--t-strong);font-weight:500;font-size:14px;word-break:break-word}
.origem .q{font:600 16px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--t-strong)}
.origem .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--s2);overflow:hidden}
.origem .bar i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.defs{margin-top:12px;font-size:12px;color:var(--t-faint);line-height:1.6}
.defs b{color:var(--t-muted);font-weight:500}

footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--b-sub);font:400 12px/1.6 var(--mono);color:var(--t-faint)}

.lock{min-height:100vh;display:grid;place-items:center;padding:16px}
.lock form{width:100%;max-width:380px;padding:32px;text-align:center}
.lock img{width:64px;margin-bottom:16px}
.lock input[type=password]{width:100%;margin:20px 0 12px;padding:12px 14px;border-radius:12px;border:1px solid var(--b-def);
  background:rgba(0,0,0,.35);color:var(--t-strong);font:400 15px Inter,sans-serif}
.lock input:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}
.lock .row{display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;color:var(--t-muted);margin-bottom:16px}
.btn{all:unset;cursor:pointer;display:block;width:100%;padding:12px 0;border-radius:12px;background:var(--acc);color:var(--on-acc);
  font:600 15px Inter,sans-serif;box-shadow:0 0 12px -2px rgba(0,216,245,.45);transition:.15s;text-align:center}
.btn:hover{background:var(--acc-h);transform:translateY(-2px);box-shadow:var(--glow)}
.btn:active{transform:scale(.975)}
.err{color:var(--neg);font-size:13px;min-height:20px;margin-top:12px}

@media (max-width:760px){
  .funil{padding:20px 16px}
  .fn-cols{display:none}
  .fn-row{grid-template-columns:1fr auto;grid-template-areas:"forma forma" "nome custo";gap:10px 12px}
  .fn-forma{height:64px}
  .fn-conn{grid-template-columns:1fr;min-height:0;padding:14px 0}
  .fn-conn .chip{grid-column:1}
  .fn-conn .nota{grid-column:1;text-align:center;margin-top:6px}
}
/* ---------- abas por funil ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:28px;padding-bottom:2px;border-bottom:1px solid var(--b-sub)}
.tabs button{all:unset;cursor:pointer;padding:12px 18px;font:600 14px/1 Inter,sans-serif;color:var(--t-muted);border-bottom:2px solid transparent;margin-bottom:-3px;transition:.15s}
.tabs button:hover{color:var(--t-strong)}
.tabs button[aria-pressed="true"]{color:var(--acc-h);border-bottom-color:var(--acc)}
.tabs button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.tabs .g{font:400 11px/1 var(--mono);color:var(--t-faint);margin-left:6px}
.filtros{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px}
.filtros .rot{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--t-faint)}
.desc{margin-top:14px;color:var(--t-muted);font-size:14px}
.pills.sm button{padding:6px 12px;font-size:12px}
select{background:var(--solid);color:var(--t-body);border:1px solid var(--b-def);border-radius:999px;padding:7px 12px;font:500 12px Inter,sans-serif}
td .url{font-family:var(--mono);font-size:12px;word-break:break-all;color:var(--t-strong)}
.funil{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.funil .et{padding:16px;position:relative;min-width:0}
.funil .et .lbl{font-size:13px;color:var(--t-muted)}
.funil .et .val{font:600 22px/1.2 var(--mono);color:var(--t-strong);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.funil .et .bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden;margin:8px 0}
.funil .et .bar i{display:block;height:100%;background:var(--acc-h, #00D8F5);border-radius:3px}
.funil .et .tx{font:400 12px/1.5 var(--mono);color:var(--t-muted)}
.funil .et .tx b{color:var(--t-strong);font-weight:600}
td .st{display:block;font:400 11px/1.4 var(--mono);color:var(--t-faint);margin-top:2px}
.leg{display:flex;gap:16px;font:400 11px/1 var(--mono);color:var(--t-muted);margin-bottom:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.ad .pg{font:400 11px/1.4 var(--mono);color:var(--t-faint);margin-top:8px;word-break:break-all}
@media (max-width:760px){ .tabs button{padding:10px 12px;font-size:13px} }
/* quebras de público e alerta dos conjuntos (config "quebras") */
.qh{margin:26px 0 10px;font:600 15px/1.3 Inter,sans-serif;color:var(--t-strong)}
tr.ruim td,tr.grave td{color:var(--neg)}
tr.acima td{color:#FFB547}
tr.ruim td .st,tr.grave td .st,tr.acima td .st{color:inherit;opacity:.75}
.alerta.ok svg{color:var(--pos)}
.idd{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--s2)}
.idd.sel{outline:1px solid var(--b-acc)}
.idd-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--s1);margin:6px 0}
.idd-bar i{display:block;height:100%}
.idd-tx{font:400 11px/1.5 var(--mono);color:var(--t-muted)}
.idd-tx b{color:var(--t-strong);font-weight:600}
.idd-tx .v,.idd-tx .v b{color:var(--neg)}
/* funil com gargalos (config "gargalos"): etapa abaixo da referência em vermelho */
.fz{padding:28px 24px 24px}
.fn-conn .chip.gg{border-color:rgba(255,77,94,.6);background:rgba(255,77,94,.08)}
.fn-conn .chip.gg b,.fn-conn .chip.gg .k,.fn-conn .chip.gg svg{color:var(--neg)}
.fn-conn .chip.top{box-shadow:0 0 22px -4px rgba(255,77,94,.65)}
.fn-conn .nota.gg{color:#FF8A94}
.tag-gg{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--neg);color:#1A0306;font:600 10px/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.fn-row.gg .fn-forma .q b{color:#FF8A94;text-shadow:none}
.fn-row.gg .fn-nome .n{color:#FF8A94}
td.gg,tr td.gg{color:var(--neg);font-weight:600}
.ad .kpis .gg b{color:var(--neg)}
tr.ruim td .lnk{color:var(--t-body)}
</style>
</head>
<body>
<div id="app"></div>
<div class="tip" id="tip"></div>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(() => {
const app = document.getElementById("app");
const tip = document.getElementById("tip");
const payload = JSON.parse(document.getElementById("payload").textContent);
const CHAVE_SENHA = "c2pro-funis-senha";
const mem = { get(k){ try { return localStorage.getItem(k); } catch(_) { return null; } },
              set(k,v){ try { localStorage.setItem(k,v); } catch(_){} } };

// ---------- formatação pt-BR ----------
let MOEDA = "BRL";
const fmtMoeda = v => new Intl.NumberFormat("pt-BR",{style:"currency",currency:MOEDA}).format(v||0);
const fmtInt = v => new Intl.NumberFormat("pt-BR",{maximumFractionDigits:0}).format(v||0);
const fmtPct = v => new Intl.NumberFormat("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}).format(v||0)+"%";
const fmtX = v => new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0)+"x";
const dataBR = iso => { const [y,m,d] = iso.split("-"); return `${d}/${m}`; };
const dataBRano = iso => { const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const div = (a,b) => b ? a/b : null;
const moedaOu = v => v == null ? "-" : fmtMoeda(v);
const pctOu = v => v == null ? "-" : fmtPct(v);
const xOu = v => v == null ? "-" : fmtX(v);

// Tipo de resultado de cada campanha (o evento que os conjuntos otimizam).
const RES = {
  compras:   {grupo:"Vendas",       un:"Compras",           cu:"Custo por compra",    conv:"visitas"},
  leads:     {grupo:"Leads",        un:"Leads",             cu:"Custo por lead",      conv:"visitas"},
  cadastros: {grupo:"Cadastros",    un:"Cadastros",         cu:"Custo por cadastro",  conv:"visitas"},
  checkouts: {grupo:"Checkouts",    un:"Checkouts",         cu:"Custo por checkout",  conv:"visitas"},
  conversas: {grupo:"WhatsApp",     un:"Conversas",         cu:"Custo por conversa",  conv:"cliques"},
  thruplay:  {grupo:"Distribuição", un:"ThruPlays",         cu:"Custo por ThruPlay",  conv:null},
  engajamento:{grupo:"Engajamento", un:"Engajamentos",      cu:"Custo por engajamento",conv:null},
  alcance:   {grupo:"Lembrete",     un:"Pessoas alcançadas",cu:"Custo por mil pessoas",conv:null, mil:true},
  visitas:   {grupo:"Visitas",      un:"Visitas à página",  cu:"Custo por visita",    conv:null},
  cliques:   {grupo:"Cliques",      un:"Cliques no link",   cu:"Custo por clique",    conv:null},
};
const ORDEM_RES = ["compras","leads","cadastros","checkouts","conversas","thruplay","engajamento","alcance","visitas","cliques"];
const SOMA = ["gasto","impressoes","alcance","cliques","thruplay","faturamento","visitas","checkouts","compras","leads","cadastros","conversas","views","engajamento"];
const vazio = () => Object.fromEntries(SOMA.map(k => [k,0]));
function somar(lista){ const t = vazio(); lista.forEach(m => SOMA.forEach(k => t[k] += m[k]||0)); return t; }
// g = Google Ads: nao tem visita a pagina, entao nao tem carregamento e a conversao e compras / cliques.
function deriv(m, r, g){
  const R = RES[r], res = m[r] || 0;
  return { ...m, res,
    cpr: R && R.mil ? div(m.gasto*1000, res) : div(m.gasto, res),
    carreg: g ? null : div(m.visitas*100, m.cliques),
    // Formulário da própria Meta não passa pela página: com menos visitas que resultados, a base vira os cliques.
    conv: g ? div(res*100, m.cliques) : R && R.conv ? div(res*100, R.conv === "visitas" && (m.visitas||0) < res ? m.cliques : m[R.conv]) : null,
    roas: div(m.faturamento, m.gasto), ctr: div(m.cliques*100, m.impressoes), cpm: div(m.gasto*1000, m.impressoes),
    hook: m.views ? div(m.views*100, m.impressoes) : null, ret: m.views ? div(m.thruplay*100, m.views) : null,
    cpv: m.views ? div(m.gasto, m.views) : null, cpe: m.engajamento ? div(m.gasto, m.engajamento) : null,
    freq: div(m.impressoes, m.alcance) };
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decifrar(senha){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(payload.sal), iterations:payload.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const txt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(payload.iv)}, chave, b64(payload.ct));
  return JSON.parse(new TextDecoder().decode(txt));
}
function telaSenha(){
  app.innerHTML = `<div class="lock"><form class="card" id="f">
    <img src="logo.png" alt="C2Pro">
    <div class="eyebrow" style="justify-content:center">Dashboard protegido</div>
    <input type="password" id="s" placeholder="Senha" autocomplete="current-password" aria-label="Senha" autofocus>
    <label class="row"><input type="checkbox" id="lembrar" checked> Lembrar neste navegador</label>
    <button class="btn" type="submit">Abrir dashboard</button>
    <div class="err" id="err"></div></form></div>`;
  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault();
    const senha = document.getElementById("s").value;
    try { const dados = await decifrar(senha);
      if (document.getElementById("lembrar").checked) mem.set(CHAVE_SENHA, senha);
      render(dados);
    } catch(_) { document.getElementById("err").textContent = "Senha incorreta."; }
  });
}
async function iniciar(){
  if (!payload.enc) return render(payload.dados);
  const salva = mem.get(CHAVE_SENHA);
  if (salva) { try { return render(await decifrar(salva)); } catch(_){} }
  telaSenha();
}

function delta(atual, anterior, melhor){
  if (atual == null || anterior == null) return `<div class="delta"><span>sem comparação</span></div>`;
  if (!anterior) return `<div class="delta"><span>${atual ? "sem base anterior" : "sem dados"}</span></div>`;
  const p = (atual - anterior) / anterior * 100;
  const txt = (p > 0 ? "+" : "") + new Intl.NumberFormat("pt-BR",{maximumFractionDigits:1}).format(p) + "%";
  let cls = ""; if (melhor && Math.abs(p) >= 0.5) cls = (p > 0) === (melhor === "sobe") ? "pos" : "neg";
  return `<div class="delta ${cls}">${txt} <span>vs anterior</span></div>`;
}
function deltaPP(atual, anterior){
  if (atual == null || anterior == null) return `<div class="delta"><span>sem comparação</span></div>`;
  const p = atual - anterior;
  const txt = (p > 0 ? "+" : "") + new Intl.NumberFormat("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}).format(p) + " p.p.";
  return `<div class="delta ${Math.abs(p) >= 0.05 ? (p > 0 ? "pos" : "neg") : ""}">${txt} <span>vs anterior</span></div>`;
}

}

function agrupar(lista, ids){
  const set = new Set(ids), g = {};
  (lista||[]).filter(x => set.has(x.c)).forEach(x => { const t = g[x.f] = g[x.f] || vazio(); SOMA.forEach(k => t[k] += x[k]||0); });
  return g;
}
// r = tipo de resultado da aba; sem r (visão geral) mostra leads e conversas, que são os resultados de contato.
function tabelaQuebra(g, rotulo, nomeF, r, ordem, marca){
  const R = r ? RES[r] : null;
  const linhas = Object.entries(g).map(([f,m]) => ({f, m: deriv(m, r || "leads")})).filter(x => x.m.gasto > 0 || x.m.res > 0);
  if (!linhas.length) return `<div class="card empty">Sem dados no período.</div>`;
  const totG = linhas.reduce((s,x) => s + x.m.gasto, 0), totR = linhas.reduce((s,x) => s + x.m.res, 0);
  linhas.sort(ordem || ((a,b) => b.m.gasto - a.m.gasto));
  const head = R ? `<th>${R.un}</th><th>% dos resultados</th><th>${R.cu}</th>` : `<th>Leads</th><th>Custo por lead</th><th>Conversas</th><th>Custo por conversa</th>`;
  const cel = m => R ? `<td class="hl">${fmtInt(m.res)}</td><td>${pctOu(div(m.res*100, totR))}</td><td>${moedaOu(m.cpr)}</td>`
    : `<td>${fmtInt(m.leads)}</td><td>${moedaOu(div(m.gasto, m.leads))}</td><td>${fmtInt(m.conversas)}</td><td>${moedaOu(div(m.gasto, m.conversas))}</td>`;
  return `<div class="card tbl-wrap"><table>
    <thead><tr><th>${rotulo}</th><th>Valor usado</th><th>% do valor</th>${head}<th>Impressões</th><th>Cliques</th><th>CTR</th></tr></thead>
    <tbody>${linhas.map(({f,m}) => `<tr${marca && marca(f) ? ' class="ruim"' : ""}><td>${esc(nomeF(f))}</td>
      <td>${fmtMoeda(m.gasto)}</td><td>${pctOu(div(m.gasto*100, totG))}</td>${cel(m)}
      <td>${fmtInt(m.impressoes)}</td><td>${fmtInt(m.cliques)}</td><td>${pctOu(m.ctr)}</td></tr>`).join("")}</tbody></table></div>`;
}
function alertaIdade(g, r){
  const res = m => r ? (m[r]||0) : (m.leads||0) + (m.conversas||0);
  let tg = 0, tr = 0, vg = 0, vr = 0;
  Object.entries(g).forEach(([f,m]) => { tg += m.gasto; tr += res(m); if (VELHO(f)) { vg += m.gasto; vr += res(m); } });
  if (!tg) return "";
  const pg = vg*100/tg, pr = tr ? vr*100/tr : 0, nome = r ? RES[r].un.toLowerCase() : "leads e conversas";
  const txt = `Quem tem <b>55 anos ou mais</b> levou <b>${fmtPct(pg)}</b> do valor usado e trouxe <b>${fmtPct(pr)}</b> d${r === "conversas" || !r ? "as" : "os"} ${esc(nome)}.`;
  return pg >= 15 || pr >= 15 ? `<div class="alerta">${ICO_ALERTA}<div>${txt} Confira a idade dos conjuntos e o Advantage+ de público.</div></div>`
    : `<div class="alerta ok">${ICO_OK}<div>${txt}</div></div>`;
}
function secaoQuebras(P, ids, r){
  if (!P.quebras) return "";
  const gi = agrupar(P.quebras.idade, ids), gg = agrupar(P.quebras.genero, ids), gp = agrupar(P.quebras.posicao, ids);
  return `<section>

    ${alertaIdade(gi, r)}
    <h3 class="qh">Idade</h3>${tabelaQuebra(gi, "Idade", nomeIdade, r, (a,b) => a.f.localeCompare(b.f), VELHO)}
    <h3 class="qh">Gênero</h3>${tabelaQuebra(gg, "Gênero", f => NOME_GEN[f] || f, r)}
    <h3 class="qh">Posicionamento</h3>${tabelaQuebra(gp, "Posicionamento", nomePos, r)}
    <p class="defs">Em vermelho, as faixas de 55 anos ou mais. Números das quebras da Meta: a soma pode ficar um pouco abaixo do total, porque a Meta deixa de fora uma parte pequena nas quebras.</p>
  </section>`;
}
// Idade de cada anúncio: resultado e valor usado por faixa; pv = % do resultado com 55+ (ou do valor, sem resultado).
const FAIXAS = ["18-24","25-34","35-44","45-54","55-64","65+"];
const COR_FAIXA = {"18-24":"rgba(0,216,245,.25)","25-34":"rgba(0,216,245,.45)","35-44":"rgba(0,216,245,.7)","45-54":"#00D8F5",
  "55-64":"#FF8A94","65+":"var(--neg)"};
function idadeDosAnuncios(P, r){
  const saida = {};
  if (!P.quebras || !P.quebras.idade_ad) return saida;
  P.quebras.idade_ad.forEach(l => {
    const a = saida[l.a] = saida[l.a] || {faixas:{}, g:0, res:0, gv:0, rv:0};
    const res = l[r] || 0, g = l.gasto || 0;
    const f = a.faixas[l.f] = a.faixas[l.f] || {g:0, res:0};
    f.g += g; f.res += res; a.g += g; a.res += res;
    if (VELHO(l.f)) { a.gv += g; a.rv += res; }
  });
  Object.values(saida).forEach(a => { a.pg = a.g ? a.gv*100/a.g : 0; a.pr = a.res ? a.rv*100/a.res : null;
    a.pv = a.pr != null ? a.pr : a.pg; });
  return saida;
}
function idadeCriativo(a, R, destaque){
  const porRes = a.res > 0, base = porRes ? a.res : a.g;
  if (!base) return "";
  const seg = FAIXAS.filter(f => a.faixas[f]).map(f => { const v = porRes ? a.faixas[f].res : a.faixas[f].g;
    return v ? `<i style="width:${v*100/base}%;background:${COR_FAIXA[f]}" title="${nomeIdade(f)}: ${porRes ? fmtInt(v)+" "+R.un.toLowerCase() : fmtMoeda(v)} (${fmtPct(v*100/base)})"></i>` : ""; }).join("");
  const cont = FAIXAS.filter(f => a.faixas[f] && (porRes ? a.faixas[f].res : a.faixas[f].g))
    .map(f => `<span${VELHO(f) ? ' class="v"' : ""}>${f} ${porRes ? fmtInt(a.faixas[f].res) : fmtPct(a.faixas[f].g*100/a.g)}</span>`).join(" · ");
  const alto = a.pv >= 30;
  return `<div class="idd${destaque ? " sel" : ""}">
    <div class="idd-tx"><span class="${alto ? "v" : ""}">55+: <b>${porRes ? fmtPct(a.pr) : "-"}</b> do resultado · <b>${fmtPct(a.pg)}</b> do valor usado</span></div>
    <div class="idd-bar">${seg}</div>
    <div class="idd-tx">${porRes ? `${esc(R.un)} por idade: ` : "Valor por idade: "}${cont}</div></div>`;
}
function secaoConjuntos(){
  if (!D.conjuntos) return "";
  const teto = D.idade_maxima || 65;
  const ate = c => c.idade_max >= 65 ? "65 ou mais" : c.idade_max;
  const grave = c => c.advantage || c.idade_max >= 65;
  const acima = c => !grave(c) && c.idade_max > teto;
  const ruins = D.conjuntos.filter(c => grave(c) || acima(c)).sort((a,b) => grave(b) - grave(a) || b.idade_max - a.idade_max);
  const nG = ruins.filter(grave).length, nA = ruins.length - nG, n = D.conjuntos.length;
  const quando = `${dataBRano(D.gerado_em.slice(0,10))} às ${D.gerado_em.slice(11,16)}`;
  const motivo = c => c.advantage ? "Advantage+ de público ligado: a idade máxima vira só sugestão para a Meta"
    : c.idade_max >= 65 ? "Sem limite de idade em cima (65 ou mais)" : `Acima do teto de ${teto} anos`;
  return `<section>
    <div class="sec-head"><div><h2>Idade dos conjuntos ativos</h2><p class="sub">${n} conjunto${n===1?"":"s"} ativo${n===1?"":"s"} conferido${n===1?"":"s"} em ${quando} · teto combinado: ${teto} anos</p></div></div>
    ${ruins.length ? `<div class="alerta">${ICO_ALERTA}<div>${nG ? `<b>${nG} conjunto${nG===1?"":"s"}</b> com a idade aberta até 65 ou mais ou com o Advantage+ de público ligado. ` : ""}${nA ? `<b>${nA}</b> acima do teto de ${teto} anos. ` : ""}Se algum estiver assim de propósito (topo de funil, por exemplo), avisem no grupo.</div></div>
    <div class="card tbl-wrap" style="margin-top:12px"><table>
      <thead><tr><th>Conjunto</th><th>Idade</th><th>Advantage+ de público</th><th>O que está fora</th></tr></thead>
      <tbody>${ruins.map(c => `<tr class="${grave(c) ? "grave" : "acima"}"><td>${esc(c.nome)}<span class="st">${esc(c.campanha || c.campanha_id)}${c.conta ? ` · ${esc(c.conta)}` : ""}</span></td>
        <td>${c.idade_min} a ${ate(c)}</td><td>${c.advantage ? "Ligado" : "Desligado"}</td><td>${motivo(c)}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="alerta ok">${ICO_OK}<div>Os ${n} conjuntos ativos estão com idade até ${teto} anos e com o Advantage+ de público desligado.</div></div>`}
  </section>`;
}

// ---------- aba de um funil ----------
function abaFunil(P, aba){
  let ids = idsDaAba(aba.id, P);
  const pubs = [...new Set(ids.map(id => camp(id).publico).filter(Boolean))];
  if (pubs.length > 1 && PUB !== "todos") ids = ids.filter(id => camp(id).publico === PUB);
  // tipos de resultado presentes, do que mais gastou para o que menos
  const gastoTipo = {};
  ids.forEach(id => { const r = camp(id).resultado; gastoTipo[r] = (gastoTipo[r]||0) + (P.campanhas[id]?.gasto||0); });
  const tipos = Object.keys(gastoTipo).filter(t => gastoTipo[t] > 0)
    .sort((a,b) => gastoTipo[b]-gastoTipo[a] || ORDEM_RES.indexOf(a)-ORDEM_RES.indexOf(b));
  if (!tipos.length) return `<p class="desc">${esc(aba.descricao||"")}</p><div class="card empty" style="margin-top:20px">Nenhuma campanha deste funil gastou no período.</div>`;
  let r = TIPO[aba.id]; if (!tipos.includes(r)) r = tipos.includes("compras") ? "compras" : tipos[0];
  const R = RES[r], G = aba.id === "google";
  const idsT = ids.filter(id => camp(id).resultado === r);
  const a = deriv(somar(idsT.map(id => P.campanhas[id] || vazio())), r, G);
  const b = deriv(somar(idsT.map(id => P.anterior[id] || vazio())), r, G);
  const ehVenda = r === "compras";
  // sem página: Google (tem outro relatório), anúncio que abre o WhatsApp ou distribuição (vídeo no feed)
  const SP = G || r === "conversas" || r === "thruplay" || r === "alcance" || r === "engajamento";

  // campanhas
  const campanhas = idsT.filter(id => P.campanhas[id]).map(id => ({c: camp(id), m: deriv(P.campanhas[id], r, G)}))
    .sort((x,y) => y.m.gasto - x.m.gasto);
  // anúncios e páginas
  // filtro de campanha (vale para páginas e criativos)
  const campsComAd = campanhas.filter(({c}) => P.anuncios.some(x => x.campanha_id === c.id));
  if (CAMPF !== "todas" && !campsComAd.some(({c}) => c.id === CAMPF)) CAMPF = "todas";
  const idsF = CAMPF === "todas" ? idsT : [CAMPF];
  const IA = idadeDosAnuncios(P, r);
  const anuncios = P.anuncios.filter(x => idsF.includes(x.campanha_id)).map(x => ({...deriv(x, r), x, idade: IA[x.id]}));
  const VID = r === "thruplay" || r === "alcance" || r === "engajamento";
  const filtroCamp = campsComAd.length > 1 ? `<label class="sub">Campanha <select id="campf" aria-label="Filtrar por campanha">
      <option value="todas">Todas (${campsComAd.length})</option>
      ${campsComAd.map(({c}) => `<option value="${esc(c.id)}"${CAMPF===c.id?" selected":""}>${esc(c.nome)}${["ACTIVE","ENABLED"].includes(c.status)?"":" (não ativa)"}</option>`).join("")}
    </select></label>` : "";
  const pags = {};
  anuncios.forEach(x => { (pags[x.x.url] = pags[x.x.url] || []).push(x.x); });
  const paginas = (G ? (P.paginas_google || []).map(x => ({u: x.url, m: deriv(x, r, true), n: "-"}))
    : Object.entries(pags).map(([u, l]) => ({u, m: deriv(somar(l), r), n: l.length}))).sort((x,y) => y.m.gasto - x.m.gasto);
  const minimo = D.gasto_minimo_criativo || 0;
  const ords = {res:"Mais resultado", cpr:"Menor custo por resultado", gasto:"Maior valor usado", ...(ehVenda ? {roas:"Maior ROAS"} : {}),
    ...(R.conv ? {conv:"Maior taxa de conversão"} : {ctr:"Maior CTR"}), ...(VID ? {hook:"Maior hook rate", ret:"Maior retenção"} : {}),
    ...(P.quebras ? {velho:"Mais 55+ (% do resultado)", novo:"Menos 55+ (% do resultado)"} : {})};
  if (!ords[ORD]) ORD = "res";
  const crit = anuncios.filter(x => x.gasto >= minimo).sort((x,y) => {
    if (ORD === "cpr") return (x.cpr ?? 1e12) - (y.cpr ?? 1e12) || y.res - x.res;
    if (ORD === "gasto") return y.gasto - x.gasto;
    if (ORD === "roas") return (y.roas||0) - (x.roas||0);
    if (ORD === "conv") return (y.conv||0) - (x.conv||0);
    if (ORD === "ctr") return (y.ctr||0) - (x.ctr||0);
    if (ORD === "hook") return (y.hook||0) - (x.hook||0);
    if (ORD === "ret") return (y.ret||0) - (x.ret||0);
    if (ORD === "velho" || ORD === "novo") { const a = x.idade ? x.idade.pv : -1, b = y.idade ? y.idade.pv : -1;
      return ORD === "velho" ? b - a || y.res - x.res : (a < 0 ? 1e9 : a) - (b < 0 ? 1e9 : b) || y.res - x.res; }
    return y.res - x.res || (x.cpr ?? 1e12) - (y.cpr ?? 1e12);
  });

  const colVenda = ehVenda ? `<th>Faturamento</th><th>ROAS</th>` : "";
  const celVenda = m => ehVenda ? `<td>${fmtMoeda(m.faturamento)}</td><td class="hl">${xOu(m.roas)}</td>` : "";

  const celConv = m => `<td class="${ggc(refConv(r, m), m.conv, baseConv(r, m))}">${pctOu(m.conv)}</td>`;

    </div>
    ${pubs.length > 1 ? `<span class="rot">Público</span><div class="pills sm" role="group" aria-label="Público">
      ${["todos", ...pubs.sort()].map(p => `<button data-pub="${p}" aria-pressed="${PUB===p}">${p==="todos"?"Todos":p==="aluno"?"Aluno":"Professor"}</button>`).join("")}</div>` : ""}
  </div>

  <section style="margin-top:24px">
    <div class="tiles">
      ${tile(R.un, fmtInt(a.res), delta(a.res,b.res,"sobe"), "", true)}
      ${tile(R.cu, moedaOu(a.cpr), delta(a.cpr,b.cpr,"desce"))}

      ${SP ? tile("Custo por clique", moedaOu(div(a.gasto,a.cliques)), delta(div(a.gasto,a.cliques),div(b.gasto,b.cliques),"desce")) : tile("Taxa de carregamento", pctOu(a.carreg), deltaPP(a.carreg,b.carreg), "visitas ÷ cliques")}
      ${R.conv ? tile("Taxa de conversão", pctOu(a.conv), deltaPP(a.conv,b.conv), convTxt) : tile("CTR", pctOu(a.ctr), deltaPP(a.ctr,b.ctr), "cliques ÷ impressões")}
      ${ehVenda ? tile(G ? "Faturamento (tag do Google)" : "Faturamento (pixel)", fmtMoeda(a.faturamento), delta(a.faturamento,b.faturamento,"sobe")) : ""}
      ${ehVenda ? tile("ROAS", xOu(a.roas), delta(a.roas,b.roas,"sobe"), "faturamento ÷ valor usado") : ""}
      ${r === "cliques" ? "" : tile("Cliques no link", fmtInt(a.cliques), delta(a.cliques,b.cliques,"sobe"), `CTR ${pctOu(a.ctr)} · CPC ${moedaOu(div(a.gasto,a.cliques))}`)}
      ${VID ? tile("Views de 3s", fmtInt(a.views), delta(a.views,b.views,"sobe"), `custo por view ${moedaOu(a.cpv)}`) : ""}
      ${VID ? tile("Hook rate", pctOu(a.hook), deltaPP(a.hook,b.hook), "views de 3s ÷ impressões") : ""}
      ${VID ? tile("Retenção", pctOu(a.ret), deltaPP(a.ret,b.ret), "ThruPlays ÷ views de 3s") : ""}
      ${VID ? tile("Engajamento", fmtInt(a.engajamento), delta(a.engajamento,b.engajamento,"sobe"), `custo por engajamento ${moedaOu(a.cpe)}`) : ""}
      ${VID ? tile("Alcance", fmtInt(a.alcance), delta(a.alcance,b.alcance,"sobe"), `frequência ${a.freq ? a.freq.toFixed(2).replace(".",",") : "-"}`) : ""}
      ${SP ? tile("Impressões", fmtInt(a.impressoes), delta(a.impressoes,b.impressoes,"sobe"), `CPM ${moedaOu(a.cpm)}`) : tile("Visitas à página", fmtInt(a.visitas), delta(a.visitas,b.visitas,"sobe"), `CPM ${moedaOu(a.cpm)}`)}
    </div>

  ${G ? "" : D.gargalos ? funilGargalos(a, b, r) : funilVisual(a, b, r)}

      <label class="sub">Ordenar por <select id="ord" aria-label="Ordenar criativos">${Object.entries(ords).map(([k,v]) => `<option value="${k}"${ORD===k?" selected":""}>${v}</option>`).join("")}</select></label></div></div>
    ${crit.length ? `<div class="ads">${crit.map((x,i) => `<div class="card ad">
      <a class="thumb" ${x.x.instagram?`href="${esc(x.x.instagram)}" target="_blank" rel="noopener"`:""}>${x.x.thumb?`<img src="${esc(x.x.thumb)}" alt="" loading="lazy">`:""}<span class="rank">${i+1}</span></a>
      <div><div class="nm">${esc(x.x.nome)} ${badge(x.x.status)}</div>
        <div class="cp">${esc(camp(x.x.campanha_id).nome)}</div>
        <div class="kpis">
          <div class="${ORD==="res"?"sel":""}">${R.un}<b>${fmtInt(x.res)}</b></div>
          <div class="${ORD==="cpr"?"sel":""}">${R.cu}<b>${moedaOu(x.cpr)}</b></div>
          <div class="${ORD==="gasto"?"sel":""}">Valor usado<b>${fmtMoeda(x.gasto)}</b></div>
          ${VID ? `<div class="${ORD==="hook"?"sel":""}${ggc("hook", x.hook, x.impressoes)}">Hook rate<b>${pctOu(x.hook)}</b></div><div class="${ORD==="ret"?"sel":""}${ggc("retencao", x.ret, x.views)}">Retenção<b>${pctOu(x.ret)}</b></div>
            <div>Views 3s<b>${fmtInt(x.views)}</b></div><div>Engajamento<b>${fmtInt(x.engajamento)}</b></div>` : ""}
          ${SP || VID ? "" : `<div class="${ggc("carregamento", x.carreg, x.cliques)}">Carregamento<b>${pctOu(x.carreg)}</b></div>`}
          ${R.conv?`<div class="${ORD==="conv"?"sel":""}${ggc(refConv(r, x), x.conv, baseConv(r, x))}">Conversão<b>${pctOu(x.conv)}</b></div>`:`<div class="${ORD==="ctr"?"sel":""}${VID ? "" : ggc("ctr", x.ctr, x.impressoes)}">CTR<b>${pctOu(x.ctr)}</b></div>`}
          ${ehVenda?`<div class="${ORD==="roas"?"sel":""}">ROAS<b>${xOu(x.roas)}</b></div>`:`<div>Cliques<b>${fmtInt(x.cliques)}</b></div>`}
          ${SP && !VID ? `<div class="${ggc("ctr", x.ctr, x.impressoes)}">CTR<b>${pctOu(x.ctr)}</b></div>` : ""}
        </div>
        ${x.idade ? idadeCriativo(x.idade, R, ORD === "velho" || ORD === "novo") : ""}
        ${VID && x.x.url === "Sem link identificado" ? "" : `<div class="pg">${esc(x.x.url)}</div>`}
        <div class="links">
          ${x.x.instagram?`<a class="lnk" href="${esc(x.x.instagram)}" target="_blank" rel="noopener">${ICO_IG} Instagram</a>`:""}
          ${x.x.previa?`<a class="lnk" href="${esc(x.x.previa)}" target="_blank" rel="noopener">${ICO_EYE} Prévia</a>`:""}
        </div></div></div>`).join("")}</div>` : `<div class="card empty">Nenhum criativo passou do gasto mínimo no período.</div>`}
  </section>`}`;
}

// ---------- funil com gargalos (config "gargalos": true ou {"ctr": 1.2, ...}) ----------
// Cada taxa de passagem é comparada com a referência; abaixo dela, a etapa fica vermelha. A pior (taxa ÷ referência)
// é o principal gargalo. Com menos de BASE_MINIMA na etapa de cima, a taxa não conta (pouco volume). U-TRAX, 27/11/2026.
const REF_PADRAO = {ctr:1, carregamento:70, pagina_lead:20, form_lead:25, conversa:40, checkout:5, compra:25, hook:25, retencao:25};
const BASE_MINIMA = 30;
const DICA = {
  ctr: "O anúncio aparece mas não faz clicar: revisar criativo, gancho e chamada para ação.",
  carregamento: "Clicam e não esperam a página abrir: conferir a velocidade da página no celular, o link e o pixel na página.",
  pagina_lead: "A página recebe visita mas não converte: promessa, prova e tamanho do formulário.",
  form_lead: "Abrem o formulário da Meta e não enviam: formulário longo ou perguntas demais.",
  conversa: "Clicam e não chamam no WhatsApp: conferir o link, o número e a mensagem pronta.",
  checkout: "Visitam a página de vendas e não vão para o pagamento: oferta, preço e botão de compra.",
  compra: "Chegam ao checkout e não pagam: meios de pagamento, preço final e recuperação de carrinho.",
  hook: "Os primeiros 3 segundos do vídeo não seguram: testar outro começo.",
  retencao: "Assistem o começo e saem: ritmo e corpo do vídeo.",
};
const refs = () => D.gargalos ? {...REF_PADRAO, ...(typeof D.gargalos === "object" ? D.gargalos : {})} : null;
const fmtRef = v => new Intl.NumberFormat("pt-BR",{maximumFractionDigits:1}).format(v) + "%";
const ICO_DOWN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>`;
// " gg" quando a taxa está abaixo da referência (para células e KPIs dos criativos)
function ggc(refK, v, base){
  const REF = refs();
  return REF && refK && REF[refK] != null && v != null && (base == null || base >= BASE_MINIMA) && v < REF[refK] ? " gg" : "";
}
// referência da taxa de conversão de uma campanha ou criativo
function refConv(r, m){
  if (r === "conversas") return "conversa";
  if (r === "leads" || r === "cadastros") return (m.visitas||0) < (m[r]||0) ? "form_lead" : "pagina_lead";
  if (r === "checkouts") return "checkout";
  return null;
}
function baseConv(r, m){ return r === "conversas" || ((r === "leads" || r === "cadastros") && (m.visitas||0) < (m[r]||0)) ? m.cliques : m.visitas; }

// Etapas (E) e taxas de passagem (T[i] liga E[i] a E[i+1]) conforme o tipo de resultado.
function etapasFunil(m, r){
  const R = RES[r] || RES.compras, REF = refs() || {};
  const E = [{k:"impressoes", nome:"Impressões", desc:"Vezes que o anúncio apareceu", v:m.impressoes||0, custo:"CPM", cv:div(m.gasto*1000, m.impressoes)}];
  const T = [];
  const passo = (e, t) => { const ant = E[E.length-1];
    T.push({...t, val:div(e.v*100, ant.v), base:ant.v, ref:t.ref ? REF[t.ref] : null, refK:t.ref, de:ant.nome, para:e.nome});
    E.push({...e, cv:div(m.gasto, e.v)}); };
  const res = m[r] || 0;
  if (r === "thruplay" || r === "engajamento" || r === "alcance") {
    if (m.views) {
      passo({k:"views", nome:"Views de 3s", desc:"Quem parou para ver o começo", v:m.views, custo:"Custo por view"},
            {nome:"Hook rate", formula:"views de 3s ÷ impressões", ref:"hook"});
      if (m.thruplay) passo({k:"thruplay", nome:"ThruPlays", desc:"Quem viu 15s ou o vídeo inteiro", v:m.thruplay, custo:"Custo por ThruPlay"},
            {nome:"Retenção", formula:"ThruPlays ÷ views de 3s", ref:"retencao"});
    } else if (m.engajamento) passo({k:"engajamento", nome:"Engajamentos", desc:"Curtidas, comentários, cliques e visitas", v:m.engajamento, custo:"Custo por engajamento"},
            {nome:"Taxa de engajamento", formula:"engajamentos ÷ impressões"});
    return {E, T};
  }
  passo({k:"cliques", nome:"Cliques no link", desc:"Quem clicou no anúncio", v:m.cliques||0, custo:"Custo por clique"},
        {nome:"CTR", formula:"cliques ÷ impressões", ref:"ctr"});
  if (r === "cliques") return {E, T};
  if (r === "conversas") {
    passo({k:"conversas", nome:"Conversas", desc:"Quem chamou no WhatsApp", v:res, custo:R.cu}, {nome:"Clique para conversa", formula:"conversas ÷ cliques", ref:"conversa"});
    return {E, T};
  }
  if ((r === "leads" || r === "cadastros") && (m.visitas||0) < res) {
    passo({k:r, nome:R.un, desc:"Formulário da própria Meta (não passa pela página)", v:res, custo:R.cu},
          {nome:`Clique para ${r === "leads" ? "lead" : "cadastro"}`, formula:`${R.un.toLowerCase()} ÷ cliques`, ref:"form_lead"});
    return {E, T};
  }
  passo({k:"visitas", nome:"Visitas à página", desc:"Quem esperou a página carregar", v:m.visitas||0, custo:"Custo por visita"},
        {nome:"Taxa de carregamento", formula:"visitas ÷ cliques", ref:"carregamento"});
  if (r === "compras" || r === "checkouts")
    passo({k:"checkouts", nome:"Checkouts", desc:"Quem foi para o pagamento", v:m.checkouts||0, custo:"Custo por checkout"},
          {nome:"Página para checkout", formula:"checkouts ÷ visitas", ref:"checkout"});
  if (r === "compras")
    passo({k:"compras", nome:"Compras", desc:"Pagamentos concluídos", v:m.compras||0, custo:"Custo por compra"},
          {nome:"Checkout para compra", formula:"compras ÷ checkouts", ref:"compra"});
  if (r === "leads" || r === "cadastros")
    passo({k:r, nome:R.un, desc:"Quem se cadastrou na página", v:res, custo:R.cu},
          {nome:`Página para ${r === "leads" ? "lead" : "cadastro"}`, formula:`${R.un.toLowerCase()} ÷ visitas`, ref:"pagina_lead"});
  return {E, T};
}
// Marca as taxas abaixo da referência e devolve as ruins, da pior para a menos pior.
function avaliar(T){
  T.forEach(t => { t.pouco = t.base < BASE_MINIMA;
    t.ruim = t.ref != null && t.val != null && !t.pouco && t.val < t.ref; t.nota = t.ruim ? t.val / t.ref : null; });
  const ruins = T.filter(t => t.ruim).sort((a,b) => a.nota - b.nota);
  if (ruins[0]) ruins[0].principal = true;
  return ruins;
}
function formaFunil(i, n, ruim){
  const L = [100, 84, 68, 52, 38, 28];
  const t = (100 - L[i]) / 2, b = (100 - L[i+1]) / 2, fim = i === n - 1;
  const cor = ruim ? "255,77,94" : "0,216,245", fill = ruim ? .2 : [.05,.08,.11,.15,.22][i] || .22;
  return `<svg viewBox="0 0 100 72" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="${t},0 ${100-t},0 ${100-b},72 ${b},72" fill="rgba(${cor},${fill})"
      stroke="rgba(${cor},${fim || ruim ? .6 : .28})" stroke-width="1" vector-effect="non-scaling-stroke"
      ${fim || ruim ? `style="filter:drop-shadow(0 0 14px rgba(${cor},.35))"` : ""}/></svg>`;
}
function funilGargalos(a, b, r){
  if (!a.impressoes) return "";
  const R = RES[r] || RES.compras;
  const {E, T} = etapasFunil(a, r), ant = etapasFunil(b, r);
  const tAnt = Object.fromEntries(ant.T.map(t => [t.nome, t.val])), eAnt = Object.fromEntries(ant.E.map(e => [e.k, e.cv]));
  const ruins = avaliar(T);
  let html = `<div class="card fz">
    <div class="fn-cols"><div>Etapa</div><div style="text-align:center">Volume</div><div>Custo por etapa</div></div>`;
  E.forEach((e, i) => {
    const entrou = T[i-1], ruim = entrou && entrou.ruim;
    html += `<div class="fn-row${i === E.length-1 ? " fim" : ""}${ruim ? " gg" : ""}">
      <div class="fn-nome"><div class="n">${esc(e.nome)}</div><div class="d">${esc(e.desc)}</div></div>
      <div class="fn-forma">${formaFunil(i, E.length, ruim)}<div class="q"><b>${fmtInt(e.v)}</b><span>${i ? `${fmtPct(e.v*100/a.impressoes)} das impressões` : "topo do funil"}</span></div></div>
      <div class="fn-custo"><div class="l">${esc(e.custo)}</div><div class="v">${moedaOu(e.cv)}</div>${delta(e.cv, eAnt[e.k], "desce")}</div>
    </div>`;
    const t = T[i];
    if (t) html += `<div class="fn-conn">
      <div class="chip${t.ruim ? " gg" : ""}${t.principal ? " top" : ""}">${ICO_DOWN}<span class="k">${esc(t.nome)}</span><b>${pctOu(t.val)}</b>${deltaPP(t.val, tAnt[t.nome])}${t.principal ? `<span class="tag-gg">Principal gargalo</span>` : t.ruim ? `<span class="tag-gg">Gargalo</span>` : ""}</div>
      <div class="nota${t.ruim ? " gg" : ""}">${esc(t.formula)}<br>${t.ref != null ? `referência: ${fmtRef(t.ref)} ou mais` : "sem referência"}${t.pouco ? " · pouco volume, não conta" : ""}<br>antes: ${pctOu(tAnt[t.nome])}</div></div>`;
  });
  html += `<div class="fn-rodape">
    <div>Valor usado: <b>${fmtMoeda(a.gasto)}</b></div>
    <div>${esc(R.un)}: <b>${fmtInt(a.res)}</b></div>
    <div>${esc(R.cu)}: <b>${moedaOu(a.cpr)}</b></div>
    ${r === "compras" ? `<div>Faturamento: <b>${fmtMoeda(a.faturamento)}</b></div><div>ROAS: <b>${xOu(a.roas)}</b></div>` : ""}
  </div>`;
  if (ruins.length) {
    const p = ruins[0], resto = ruins.slice(1);
    const frase = ["ctr","hook"].includes(p.refK) ? "" : ` De cada 100 ${esc(p.de.toLowerCase())}, ${fmtInt(p.val)} viram ${esc(p.para.toLowerCase())}.`;
    html += `<div class="alerta">${ICO_ALERTA}<div><b>Principal gargalo: ${esc(p.nome)}</b> em ${pctOu(p.val)}, abaixo da referência de ${fmtRef(p.ref)}.${frase}
      ${DICA[p.refK] || ""}${resto.length ? `<br>Também abaixo da referência: ${resto.map(t => `<b>${esc(t.nome)}</b> (${pctOu(t.val)}, referência ${fmtRef(t.ref)})`).join(", ")}.` : ""}</div></div>`;
  } else if (T.some(t => t.ref != null && !t.pouco && t.val != null)) {
    html += `<div class="alerta ok">${ICO_OK}<div>Nenhuma etapa abaixo da referência neste período.</div></div>`;
  }
  return `<section>
    <div class="sec-head"><div><h2>Funil</h2><p class="sub">Do anúncio visto até o resultado. Em vermelho, as etapas que passam menos gente do que a referência.</p></div></div>
    ${html}</div>
  </section>`;
}
// Visão geral: o principal gargalo de cada funil e tipo de campanha.
function secaoGargalos(P, abas){
  if (!D.gargalos) return "";
  const linhas = [];
  abas.filter(a => a.id !== "google").forEach((aba, ordem) => {
    const porTipo = {};
    idsDaAba(aba.id, P).filter(id => P.campanhas[id]).forEach(id => (porTipo[camp(id).resultado] = porTipo[camp(id).resultado] || []).push(P.campanhas[id]));
    Object.entries(porTipo).forEach(([r, l]) => {
      const m = deriv(somar(l), r); if (!m.gasto || !m.impressoes) return;
      const {T} = etapasFunil(m, r);
      linhas.push({aba, ordem, r, m, ruins: avaliar(T)});
    });
  });
  if (!linhas.length) return "";
  linhas.sort((x,y) => x.ordem - y.ordem || y.m.gasto - x.m.gasto);
  const nRuim = linhas.filter(x => x.ruins.length).length;
  return `<section>
    <div class="sec-head"><div><h2>Gargalos por funil</h2><p class="sub">${nRuim} de ${linhas.length} funis com alguma etapa abaixo da referência · clique em "Ver funil" para abrir</p></div></div>
    <div class="card tbl-wrap"><table>
      <thead><tr><th>Funil</th><th>Valor usado</th><th>Resultado</th><th>Principal gargalo</th><th>Taxa</th><th>Referência</th><th>Também abaixo</th><th></th></tr></thead>
      <tbody>${linhas.map(({aba, r, m, ruins}) => { const p = ruins[0]; return `<tr${p ? ' class="ruim"' : ""}>
        <td>${esc(aba.nome)}<span class="st">${esc(RES[r].grupo)}</span></td>
        <td>${fmtMoeda(m.gasto)}</td><td>${fmtInt(m.res)}<span class="st">${esc(RES[r].un.toLowerCase())}</span></td>
        <td>${p ? esc(p.nome) : "Nenhum"}</td><td>${p ? pctOu(p.val) : "-"}</td><td>${p ? fmtRef(p.ref) : "-"}</td>
        <td>${ruins.slice(1).map(t => esc(t.nome)).join(", ") || "-"}</td>
        <td><button class="lnk" data-ir="${esc(aba.id)}|${r}">Ver funil</button></td></tr>`; }).join("")}
      </tbody></table></div>
    <p class="defs">Referências: CTR ${fmtRef(refs().ctr)}, carregamento ${fmtRef(refs().carregamento)}, página para lead ${fmtRef(refs().pagina_lead)},
      formulário da Meta ${fmtRef(refs().form_lead)}, clique para conversa ${fmtRef(refs().conversa)}, página para checkout ${fmtRef(refs().checkout)},
      checkout para compra ${fmtRef(refs().compra)}, hook rate ${fmtRef(refs().hook)} e retenção ${fmtRef(refs().retencao)}.
      Etapa com menos de ${BASE_MINIMA} pessoas na entrada não conta como gargalo.</p>
  </section>`;
}

// ---------- funil visual da aba (impressões > cliques > visitas > checkout > resultado) ----------
function funilVisual(a, b, r){
  if (!a.impressoes) return "";
  const R = RES[r];
  const et = [{lbl:"Impressões", v:a.impressoes, vb:b.impressoes, tx:`CPM <b>${moedaOu(a.cpm)}</b>`}];
  et.push({lbl:"Cliques no link", v:a.cliques, vb:b.cliques, tx:`CTR <b>${pctOu(a.ctr)}</b> · CPC <b>${moedaOu(div(a.gasto,a.cliques))}</b>`});
  if (R.conv === "visitas" || a.visitas) et.push({lbl:"Visitas à página", v:a.visitas, vb:b.visitas, tx:`Carregamento <b>${pctOu(a.carreg)}</b> · custo <b>${moedaOu(div(a.gasto,a.visitas))}</b>`});
  if (r === "compras") et.push({lbl:"Checkouts", v:a.checkouts, vb:b.checkouts, tx:`Página → checkout <b>${pctOu(div(a.checkouts*100,a.visitas))}</b> · custo <b>${moedaOu(div(a.gasto,a.checkouts))}</b>`});
  if (["compras","leads","cadastros","conversas","checkouts"].includes(r) && r !== "checkouts")
    et.push({lbl:R.un, v:a.res, vb:b.res, tx:`${r==="compras" ? `Checkout → compra <b>${pctOu(div(a.res*100,a.checkouts))}</b>` : `Conversão <b>${pctOu(a.conv)}</b>`} · ${R.cu.toLowerCase()} <b>${moedaOu(a.cpr)}</b>`});
  const max = et[0].v || 1;
  return `<section>
    <div class="sec-head"><div><h2>Funil</h2><p class="sub">Do anúncio visto até o resultado, com a taxa de passagem de cada etapa</p></div></div>
    <div class="funil">${et.map(e => `<div class="card et">
      <div class="lbl">${esc(e.lbl)}</div><div class="val">${fmtInt(e.v)}</div>
      <div class="bar"><i style="width:${Math.max(2, Math.sqrt(e.v / max) * 100)}%"></i></div>
      <div class="tx">${e.tx}</div>${delta(e.v, e.vb, "sobe")}</div>`).join("")}</div>
  </section>`;
}

// ---------- gráfico dia a dia (30 dias) ----------
let GDADOS = null;
function grafico(ids, r){
  const R = RES[r];
  const dias = D.dias.map(d => { const t = vazio(); ids.forEach(id => { const x = (D.diario[id]||{})[d]; if (x) SOMA.forEach(k => t[k] += x[k]||0); }); return {d, g:t.gasto, v:t[r]||0}; });
  GDADOS = {dias, R};
  const W = 1000, H = 200, pad = 28, n = dias.length, bw = (W - pad) / n;
  const maxG = Math.max(1, ...dias.map(x => x.g)), maxV = Math.max(1, ...dias.map(x => x.v));
  const barras = dias.map((x,i) => { const h = x.g / maxG * (H - 30);
    return `<rect x="${pad + i*bw + 2}" y="${H - 20 - h}" width="${Math.max(1,bw-4)}" height="${h}" rx="2" fill="rgba(0,216,245,.28)"/>`; }).join("");
  const pts = dias.map((x,i) => `${pad + i*bw + bw/2},${H - 20 - x.v / maxV * (H - 30)}`).join(" ");
  const eixo = dias.map((x,i) => i % 5 === 0 ? `<text class="axis" x="${pad + i*bw + bw/2}" y="${H-4}" text-anchor="middle">${dataBR(x.d)}</text>` : "").join("");
  const totG = dias.reduce((s,x) => s + x.g, 0), totV = dias.reduce((s,x) => s + x.v, 0);
  return `<h3>Dia a dia · últimos 30 dias</h3>
    <div class="tot">${fmtMoeda(totG)} usados · ${fmtInt(totV)} ${R.un.toLowerCase()}</div>
    <div class="leg"><span><i style="background:rgba(0,216,245,.45)"></i>Valor usado</span><span><i style="background:#F2F6FA"></i>${esc(R.un)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Valor usado e ${esc(R.un)} por dia">
      <line x1="${pad}" x2="${W}" y1="${H-20}" y2="${H-20}" stroke="var(--grid)"/>
      ${barras}<polyline points="${pts}" fill="none" stroke="#F2F6FA" stroke-width="2" vector-effect="non-scaling-stroke"/>
      ${eixo}<rect id="gh" x="${pad}" y="0" width="${W-pad}" height="${H}" fill="transparent"/></svg>`;
}
function ligarGrafico(){
  const caixa = document.getElementById("graf"); if (!caixa || !GDADOS) return;
  const svg = caixa.querySelector("svg");
  svg.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect(), pad = 28 / 1000 * r.width;
    const i = Math.min(GDADOS.dias.length - 1, Math.max(0, Math.floor((e.clientX - r.left - pad) / ((r.width - pad) / GDADOS.dias.length))));
    const x = GDADOS.dias[i];
    tip.innerHTML = `<b>${dataBRano(x.d)}</b><br>Valor usado: ${fmtMoeda(x.g)}<br>${esc(GDADOS.R.un)}: ${fmtInt(x.v)}`;
    tip.style.opacity = 1; tip.style.left = (e.pageX + 14) + "px"; tip.style.top = (e.pageY - 10) + "px";
  });
  svg.addEventListener("mouseleave", () => tip.style.opacity = 0);
}

iniciar();
})();
</script>
