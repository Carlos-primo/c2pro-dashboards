<style>

async function abrir(senha){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  var chave=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(PAYLOAD.sal),iterations:PAYLOAD.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(PAYLOAD.iv)},chave,b(PAYLOAD.ct)));
  try{sessionStorage.setItem(CHAVE,senha);}catch(_){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  abrir(document.getElementById('s').value).catch(function(){document.getElementById('e').textContent='Senha incorreta.';});
});
try{var g=sessionStorage.getItem(CHAVE);if(g)abrir(g).catch(function(){});}catch(_){}
