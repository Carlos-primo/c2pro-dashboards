<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ingressos Todos Arquitetura</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070A; --solid:#0A0E14;
  --s1:rgba(255,255,255,.028); --s2:rgba(255,255,255,.048);
  --b-sub:rgba(255,255,255,.07); --b-def:rgba(255,255,255,.12); --b-strong:rgba(255,255,255,.2); --b-acc:rgba(0,216,245,.45);
  --t-strong:#F2F6FA; --t-body:#C9D2DD; --t-muted:#9AA6B6; --t-faint:#6B788A;
  --acc:#00D8F5; --acc-h:#37E6FF; --on-acc:#00171C; --acc-soft:rgba(0,216,245,.12);
  --pos:#23D18B; --neg:#FF4D5E; --warn:#F5B83D;
  --grid:rgba(255,255,255,.07);
  --card:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  --elev:0 12px 32px -8px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06);
  --glow:0 0 24px -4px rgba(0,216,245,.5),0 0 60px -12px rgba(0,216,245,.3);
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(900px 500px at 85% -10%,rgba(0,74,173,.22),transparent 60%),
             radial-gradient(700px 400px at 0% 0%,rgba(0,216,245,.07),transparent 60%),var(--bg);
  background-attachment:fixed;
  color:var(--t-body);font:400 15px/1.55 Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
.wrap{max-width:1200px;margin:0 auto;padding:32px 16px 64px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
h1{margin:10px 0 6px;font-weight:800;font-size:clamp(28px,5vw,40px);letter-spacing:-.035em;line-height:1.1;
  background:linear-gradient(180deg,#F2F6FA,#9AA6B6);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 4px;font-weight:700;font-size:20px;letter-spacing:-.022em;color:var(--t-strong)}
h3{margin:0;font:600 15px/1.3 Inter,sans-serif;color:var(--t-strong)}
.sub{color:var(--t-muted);font-size:14px;margin:0}
section{margin-top:36px}
.panel > section:first-child{margin-top:8px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}

header{display:flex;gap:16px;align-items:center}
header img{width:52px;height:52px;object-fit:contain}
.meta{margin-top:14px;display:flex;gap:8px 20px;flex-wrap:wrap;font:400 12px/1.4 var(--mono);color:var(--t-faint)}
.meta b{color:var(--t-muted);font-weight:500}

.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:28px -16px 0;padding:4px 16px 12px;scroll-padding-inline:16px;
  position:sticky;top:0;z-index:4;background:linear-gradient(180deg,var(--bg) 75%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;
  border:1px solid var(--b-def);background:var(--s1);color:var(--t-muted);font:500 13.5px/1 Inter,sans-serif;transition:.15s;margin-top:10px}
.tab .n{font:600 11px/1 var(--mono);color:var(--t-faint)}
.tab:hover{color:var(--t-strong);border-color:var(--b-strong)}
.tab[aria-selected="true"]{border-color:var(--b-acc);background:rgba(0,216,245,.16);color:#b3f7ff;box-shadow:0 0 12px -2px rgba(0,216,245,.45)}
.tab[aria-selected="true"] .n{color:var(--acc)}
.tab:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tab.ins{border-color:rgba(0,216,245,.3)}

.pills{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;padding:4px;border:1px solid var(--b-def);border-radius:999px;background:var(--s1)}
.pills button{all:unset;cursor:pointer;white-space:nowrap;flex:none;padding:8px 14px;border-radius:999px;font:500 13px/1 Inter,sans-serif;color:var(--t-muted);transition:.15s}
.pills button:hover{color:var(--t-strong)}
.pills button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);box-shadow:0 0 12px -2px rgba(0,216,245,.45)}
.pills button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.card{background:var(--card);border:1px solid var(--b-sub);border-radius:18px;box-shadow:var(--elev)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px}
.tile{padding:20px}
.tile.hero{border-color:var(--b-acc);box-shadow:var(--elev),var(--glow)}
.tile .lbl{font-size:13px;color:var(--t-muted);margin-bottom:10px}
.tile .val{font:600 22px/1.1 var(--mono);font-variant-numeric:tabular-nums;color:var(--t-strong);letter-spacing:-.02em}
.tile.hero .val{color:var(--acc-h)}
.tile .extra{margin-top:8px;font:400 12px/1.4 var(--mono);color:var(--t-muted)}

/* funil */
.funil{padding:28px 24px 24px}
.fn-row{display:grid;grid-template-columns:200px minmax(0,1fr) 200px;grid-template-areas:"nome forma custo";gap:0 24px;align-items:center}
.fn-nome{grid-area:nome}
.fn-nome .n{color:var(--t-strong);font-weight:600;font-size:15px;line-height:1.3}
.fn-nome .d{color:var(--t-faint);font-size:12px;line-height:1.4;margin-top:2px}
.fn-forma{grid-area:forma;position:relative;height:72px}
.fn-forma svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fn-forma .q{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.fn-forma .q b{font:600 24px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--t-strong);letter-spacing:-.02em}
.fn-forma .q span{font:400 11px/1.2 var(--mono);color:var(--t-muted)}
.fn-row.fim .fn-forma .q b{color:var(--acc-h);text-shadow:0 0 18px rgba(0,216,245,.45)}
.fn-custo{grid-area:custo;text-align:right}
.fn-custo .l{font-size:12px;color:var(--t-muted)}
.fn-custo .v{font:600 18px/1.2 var(--mono);font-variant-numeric:tabular-nums;color:var(--t-strong);margin-top:2px}
.fn-row.fim .fn-custo .v{color:var(--acc-h)}
.fn-conn{display:grid;grid-template-columns:200px minmax(0,1fr) 200px;gap:0 24px;align-items:center;min-height:52px}
.fn-conn .chip{grid-column:2;justify-self:center;display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  padding:6px 14px;border-radius:999px;border:1px solid var(--b-def);background:var(--solid);font:400 12px/1.3 var(--mono);color:var(--t-muted)}
.fn-conn .chip b{color:var(--t-strong);font-weight:600;font-size:14px}
.fn-conn .chip .k{font-family:Inter,sans-serif;font-weight:500;color:var(--t-body)}
.fn-conn .chip svg{width:14px;height:14px;color:var(--acc)}
.fn-conn .chip.pior{border-color:rgba(245,184,61,.5)}
.fn-conn .nota{grid-column:3;text-align:right;font:400 11px/1.4 var(--mono);color:var(--t-faint)}
.fn-rodape{margin-top:24px;padding-top:18px;border-top:1px solid var(--b-sub);display:flex;flex-wrap:wrap;gap:12px 32px;font:400 12px/1.5 var(--mono);color:var(--t-muted)}
.fn-rodape b{color:var(--t-strong);font-weight:600}

.aviso{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:14px;border:1px solid var(--b-def);background:var(--s1);font-size:14px;color:var(--t-body)}
.aviso svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--acc)}
.aviso b{color:var(--t-strong)}
.aviso.bonus{border-color:var(--b-acc);background:var(--acc-soft)}

.fases{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.fase{padding:20px}
.fase .tag{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.fase h3{margin:8px 0 2px}
.fase .per{font:400 12px/1.4 var(--mono);color:var(--t-faint);margin-bottom:14px}
.fase .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;font:400 12px/1.35 var(--mono);color:var(--t-muted)}
.fase .kv b{display:block;color:var(--t-strong);font-weight:600;font-size:16px;margin-top:2px}
.fase .kv .hl b{color:var(--acc-h)}

.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px}
.chart{padding:20px 20px 12px;position:relative}
.chart .tot{font:400 12px/1.4 var(--mono);color:var(--t-muted);margin:4px 0 12px}
.chart svg{display:block;width:100%;height:200px;overflow:visible;touch-action:pan-y}
.axis{font:400 10px var(--mono);fill:var(--t-faint)}
.tip{position:absolute;pointer-events:none;background:var(--solid);border:1px solid var(--b-def);border-radius:10px;
  padding:8px 10px;font:400 12px/1.45 var(--mono);color:var(--t-body);white-space:nowrap;box-shadow:0 4px 16px -4px rgba(0,0,0,.6);
  opacity:0;transition:opacity .1s;z-index:9}
.tip b{color:var(--t-strong);font-weight:600}
details{margin-top:14px}
summary{cursor:pointer;color:var(--t-muted);font-size:13px}
summary:hover{color:var(--acc-h)}

.tbl-wrap{overflow-x:auto;border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:500 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--t-faint);text-align:right;padding:14px 10px;border-bottom:1px solid var(--b-def);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--b-sub);text-align:right;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--t-body)}
th:first-child,td:first-child{text-align:left;padding-left:16px}
td:first-child{font-family:Inter,sans-serif;color:var(--t-strong);white-space:normal;min-width:180px}
td.dia{min-width:0;white-space:nowrap;font-family:var(--mono)}
td .datas{display:block;font:400 11px/1.4 var(--mono);color:var(--t-faint);margin-top:2px}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--s1)}
tr.tot td{border-top:1px solid var(--b-def);color:var(--t-strong);font-weight:600}
tr.depois td{color:var(--t-faint)}
td.hl{color:var(--acc-h)}
td.ruim{color:var(--warn)}
.barra{display:inline-block;vertical-align:middle;width:72px;height:6px;border-radius:3px;background:var(--s2);margin-left:10px;position:relative;overflow:hidden}
.barra i{position:absolute;inset:0;width:var(--w);background:var(--acc);border-radius:3px}
.badge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font:500 10px/1.6 var(--mono);letter-spacing:.06em;border:1px solid var(--b-def);color:var(--t-muted);vertical-align:1px}

.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.ad{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:16px;align-items:start}
.ad .thumb{position:relative;display:block;width:96px;height:128px;border-radius:12px;overflow:hidden;background:var(--s2);border:1px solid var(--b-sub)}
.ad .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ad .rank{position:absolute;top:6px;left:6px;min-width:24px;padding:2px 6px;border-radius:999px;background:rgba(5,7,10,.8);
  border:1px solid var(--b-def);font:600 11px/1.4 var(--mono);color:var(--t-strong);text-align:center}
.ad .nm{color:var(--t-strong);font-weight:600;font-size:14px;line-height:1.3;word-break:break-word}
.ad .cp{color:var(--t-faint);font-size:12px;margin:2px 0 10px;word-break:break-word}
.ad .kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font:400 12px/1.35 var(--mono);color:var(--t-muted)}
.ad .kpis b{display:block;color:var(--t-strong);font-weight:500;font-size:13px}
.ad .kpis .sel b{color:var(--acc-h)}
.lnk{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--b-def);
  color:var(--t-body);font:500 12px/1.2 Inter,sans-serif;text-decoration:none;transition:.15s}
.lnk:hover{border-color:var(--b-acc);color:var(--acc-h);background:var(--acc-soft)}
.lnk svg{width:14px;height:14px}
.lnk:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}

/* insights */
.ins-lista{display:grid;gap:16px}
.ins-card{padding:22px 22px 20px;display:grid;grid-template-columns:44px 1fr;gap:4px 16px}
.ins-card .num{grid-row:span 3;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--b-acc);
  background:var(--acc-soft);font:600 15px/1 var(--mono);color:var(--acc-h)}
.ins-card h3{font-size:17px;letter-spacing:-.01em;line-height:1.35}
.ins-card .ev{margin:6px 0 0;color:var(--t-body);font-size:14.5px}
.ins-card .ev b{color:var(--t-strong);font-family:var(--mono);font-weight:600;font-size:13.5px}
.ins-card .rec{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--b-sub);font-size:14px;color:var(--t-body)}
.ins-card .rec::before{content:"Próximo lançamento";display:block;font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.ins-card .cat{font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--t-faint)}

.defs{font-size:12px;color:var(--t-faint);line-height:1.7}
.defs b{color:var(--t-muted);font-weight:500}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--b-sub);font:400 12px/1.6 var(--mono);color:var(--t-faint)}

@media (max-width:760px){
  .funil{padding:20px 16px}
  .fn-row{grid-template-columns:1fr auto;grid-template-areas:"forma forma" "nome custo";gap:10px 12px}
  .fn-forma{height:64px}
  .fn-conn{grid-template-columns:1fr;min-height:0;padding:14px 0}
  .fn-conn .chip{grid-column:1}
  .fn-conn .nota{grid-column:1;text-align:center;margin-top:6px}
  .ads,.grid2{grid-template-columns:1fr}
  .ad{grid-template-columns:80px 1fr}
  .ad .thumb{width:80px;height:108px}
  .ins-card{grid-template-columns:1fr}
  .ins-card .num{grid-row:auto;width:36px;height:36px;margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(() => {
const D = JSON.parse(document.getElementById("dados").textContent);
const app = document.getElementById("app");

// ---------- formatação pt-BR ----------
const fmtMoeda = v => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);
const fmtMoeda0 = v => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}).format(v||0);
const fmtInt = v => new Intl.NumberFormat("pt-BR",{maximumFractionDigits:0}).format(v||0);
const fmtPct = (v,c=1) => v == null ? "-" : new Intl.NumberFormat("pt-BR",{minimumFractionDigits:c,maximumFractionDigits:c}).format(v)+"%";
const fmtX = v => v == null ? "-" : new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(v)+"x";
const fmtCompacto = v => new Intl.NumberFormat("pt-BR",{notation:"compact",maximumFractionDigits:1}).format(v||0);
const dataBR = iso => { const [y,m,d] = iso.split("-"); return `${d}/${m}`; };
const dataBRano = iso => { const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const div = (a,b) => b ? a/b : null;
const moedaOu = v => v == null ? "-" : fmtMoeda(v);
const soma = (lista, k) => lista.reduce((s,x) => s + (x[k]||0), 0);

// Métricas derivadas. g=investimento, i=impressões, c=cliques no link, l=visitas à página,
// k=checkouts, ci/vi=ingressos e faturamento com ingressos, cp/vp=compras e valor do produto principal atribuídas.
function der(m){
  return { ...m,
    cpm: div(m.g*1000, m.i), ctr: div(m.c*100, m.i), connect: div(m.l*100, m.c),
    tx_chk: div(m.k*100, m.l), tx_compra: div(m.ci*100, m.k), tx_total: div(m.ci*100, m.l),
    cpc: div(m.g, m.c), c_visita: div(m.g, m.l), c_chk: div(m.g, m.k), cpa: div(m.g, m.ci),
    roas: div(m.vi, m.g), ticket: div(m.vi, m.ci) };
}
const total = lista => ({ g:soma(lista,"g"), i:soma(lista,"i"), c:soma(lista,"c"), l:soma(lista,"l"), k:soma(lista,"k"),
  ci:soma(lista,"ci"), vi:soma(lista,"vi"), cp:soma(lista,"cp"), vp:soma(lista,"vp") });

// ---------- recortes ----------
const DIAS = D.diario;
const ativos = DIAS.filter(d => d.g > 0);
const INI = ativos[0].d, FIM = ativos[ativos.length-1].d;
const T = der(total(DIAS));
T.a = soma(D.campanhas, "a");
const FASES = [
  {nome:"Arranque", ini:"2026-08-27", fim:"2026-09-02", txt:"Campanhas entrando no ar, verba baixa"},
  {nome:"Escala", ini:"2026-09-03", fim:"2026-09-13", txt:"Verba multiplicada e muitas versões novas de campanha"},
  {nome:"Reta final", ini:"2026-09-14", fim:"2026-09-15", txt:"Últimos dois dias de venda do ingresso"},
].map(f => { const ds = DIAS.filter(d => d.d >= f.ini && d.d <= f.fim);
  return { ...f, dias: ds.length, ...der(total(ds)) }; });
const DEPOIS = der(total(DIAS.filter(d => d.d > FIM)));

const curto = n => n.replace(/^C2PRO_LP01_CAPTACAO_/,"");
// O nome "ASP_AGOST_2_v2" foi usado em duas campanhas diferentes.
const vistos = {};
D.campanhas.forEach(c => { const n = curto(c.nome); vistos[n] = (vistos[n]||0) + 1; c.rotulo = vistos[n] > 1 ? `${n} (2ª)` : n; });
const CAMPS = D.campanhas.map(der);

const ICO_IG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>`;
const ICO_DOWN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>`;
const ICO_INFO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>`;
const ICO_STAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;

function tile(lbl, val, extra, hero){
  return `<div class="card tile${hero?" hero":""}"><div class="lbl">${esc(lbl)}</div>
    <div class="val">${val}</div>${extra?`<div class="extra">${extra}</div>`:""}</div>`;
}

// ---------- funil ----------
const ETAPAS = [
  {k:"i",  nome:"Impressões",          desc:"Vezes que o anúncio apareceu",    custo:"CPM",                 cv:m => m.cpm},
  {k:"c",  nome:"Cliques no link",     desc:"Quem clicou pra ir à página",     custo:"Custo por clique",    cv:m => m.cpc},
  {k:"l",  nome:"Visitas à página",    desc:"Quem esperou a página carregar",  custo:"Custo por visita",    cv:m => m.c_visita},
  {k:"k",  nome:"Checkouts iniciados", desc:"Quem foi para o pagamento",       custo:"Custo por checkout",  cv:m => m.c_chk},
  {k:"ci", nome:"Ingressos vendidos",  desc:"Pagamentos do ingresso",          custo:"Custo por ingresso",  cv:m => m.cpa},
];
const TAXAS = [
  {k:"ctr",       nome:"CTR",                  formula:"cliques ÷ impressões"},
  {k:"connect",   nome:"Connect rate",         formula:"visitas ÷ cliques"},
  {k:"tx_chk",    nome:"Página para checkout", formula:"checkouts ÷ visitas"},
  {k:"tx_compra", nome:"Checkout para compra", formula:"ingressos ÷ checkouts"},
];
function forma(i){
  const L = [100, 84, 68, 52, 38, 28];
  const t = (100 - L[i]) / 2, b = (100 - L[i+1]) / 2;
  const fill = [.05,.08,.11,.15,.22][i];
  const fim = i === ETAPAS.length - 1;
  return `<svg viewBox="0 0 100 72" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="${t},0 ${100-t},0 ${100-b},72 ${b},72" fill="rgba(0,216,245,${fill})"
      stroke="${fim ? "rgba(0,216,245,.6)" : "rgba(0,216,245,.28)"}" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>`;
}
function funil(a){
  let html = `<div class="card funil">`;
  ETAPAS.forEach((e, i) => {
    const pctTopo = i ? `${fmtPct(a[e.k]*100/a.i, 2)} das impressões` : "topo do funil";
    html += `<div class="fn-row${i === ETAPAS.length-1 ? " fim" : ""}">
      <div class="fn-nome"><div class="n">${e.nome}</div><div class="d">${e.desc}</div></div>
      <div class="fn-forma">${forma(i)}<div class="q"><b>${fmtInt(a[e.k])}</b><span>${pctTopo}</span></div></div>
      <div class="fn-custo"><div class="l">${e.custo}</div><div class="v">${moedaOu(e.cv(a))}</div></div></div>`;
    const t = TAXAS[i];
    if (t) html += `<div class="fn-conn"><div class="chip${t.k==="tx_chk"?" pior":""}">${ICO_DOWN}<span class="k">${t.nome}</span><b>${fmtPct(a[t.k], t.k==="ctr"?2:1)}</b></div>
      <div class="nota">${t.formula}</div></div>`;
  });
  html += `<div class="fn-rodape">
      <div>Da visita ao ingresso: <b>${fmtPct(a.tx_total)}</b></div>
      <div>Faturamento com ingressos: <b>${fmtMoeda(a.vi)}</b></div>
      <div>ROAS dos ingressos: <b>${fmtX(a.roas)}</b></div>
      <div>Ticket médio: <b>${moedaOu(a.ticket)}</b></div></div></div>`;
  return html;
}

// ---------- abas ----------
const ABAS = [
  {id:"resumo", nome:"Resumo"}, {id:"dia", nome:"Dia a dia"}, {id:"campanhas", nome:"Campanhas"},
  {id:"criativos", nome:"Criativos"}, {id:"publico", nome:"Público"}, {id:"insights", nome:"Insights"},
];
let ABA = (location.hash || "").slice(1);
if (!ABAS.some(a => a.id === ABA)) ABA = "resumo";

function pResumo(){
  const a = T;
  return `<section>
    <div class="tiles">
      ${tile("Custo por ingresso", moedaOu(a.cpa), `${fmtInt(a.ci)} ingressos`, true)}
      ${tile("Ingressos vendidos", fmtInt(a.ci), `em ${ativos.length} dias de campanha`)}
      ${tile("Investimento", fmtMoeda(a.g), `${fmtMoeda0(a.g/ativos.length)} por dia, em média`)}
      ${tile("Faturamento com ingressos", fmtMoeda(a.vi), "registrado pelo pixel")}
      ${tile("ROAS dos ingressos", fmtX(a.roas), "faturamento ÷ investimento")}
      ${tile("Ticket médio", moedaOu(a.ticket), "por ingresso")}
    </div>
  </section>
  <section>
    <div class="aviso bonus">${ICO_STAR}<div><b>Além dos ingressos:</b> entre ${dataBR("2026-09-15")} e ${dataBR("2026-09-17")}, o pixel atribuiu a essas
      campanhas <b>${fmtInt(a.cp)} compras do produto principal</b> (cerca de <b>${fmtMoeda0(a.vp)}</b>), de quem viu ou clicou nos anúncios do ingresso.
      Somando tudo, as campanhas de captação devolveram <b>${fmtX((a.vi+a.vp)/a.g)}</b> o investimento. Esses valores estão fora dos números de ingresso deste relatório.</div></div>
  </section>
  <section>
    <div class="sec-head"><div><h2>Funil da captação</h2><p class="sub">Do anúncio até o ingresso pago, somando toda a captação (${dataBR(INI)} a ${dataBR(FIM)}).</p></div></div>
    ${funil(a)}
  </section>
  <section>
    <div class="sec-head"><div><h2>Entrega</h2><p class="sub">Verba e alcance das ${CAMPS.length} campanhas de ingresso.</p></div></div>
    <div class="tiles">
      ${tile("Impressões", fmtInt(a.i))}
      ${tile("Alcance somado", fmtInt(a.a), "soma das campanhas, a mesma pessoa pode contar mais de uma vez")}
      ${tile("CPM", moedaOu(a.cpm))}
      ${tile("CTR", fmtPct(a.ctr, 2), "cliques no link ÷ impressões")}
      ${tile("Custo por clique", moedaOu(a.cpc))}
      ${tile("Connect rate", fmtPct(a.connect), "visitas ÷ cliques")}
    </div>
  </section>`;
}

function pDia(){
  const linhaTabela = (d, cls="") => { const m = der(d);
    return `<tr class="${cls}"><td class="dia">${dataBRano(d.d)}</td><td>${fmtMoeda(m.g)}</td><td>${moedaOu(m.cpm)}</td><td>${fmtPct(m.ctr,2)}</td>

// ---------- insights (números calculados a partir dos dados acima) ----------

  const B = x => `<b>${x}</b>`;
  const camposC = CAMPS.filter(c => c.ci >= 10).sort((a,b) => a.cpa - b.cpa);
  const melhores = camposC.slice(0,3), piores = camposC.slice(-3).reverse();
  const curtas = CAMPS.filter(c => c.ini && ((new Date(c.fim) - new Date(c.ini)) / 864e5 + 1) <= 7).length;
  const vid = ADS.filter(a => a.tipo==="video"), est = ADS.filter(a => a.tipo==="estatico");
  const agg = l => { const m = {g:soma(l,"g"), i:soma(l,"i"), c:soma(l,"c"), l:soma(l,"l"), k:soma(l,"k"), cp:soma(l,"cp")}; return {...m, ...derAd(m)}; };
  const V = agg(vid), E = agg(est);
  const top = ADS[0];
  const fem = D.genero.find(g => g.k==="female"), mas = D.genero.find(g => g.k==="male");
  const cpaG = g => div(g.g, g.cp);
  const id = k => D.idade.find(x => x.k===k);
  const an = D.posicao.filter(p => p.k.startsWith("audience_network"));
  const anM = {g:soma(an,"g"), c:soma(an,"c"), i:soma(an,"i"), cp:soma(an,"cp")};
  const ig = D.posicao.filter(p => p.k.startsWith("instagram"));
  const rmk = CAMPS.find(c => c.nome.includes("RMK"));
  const abandono = T.k - T.ci;
  const finais = ADS.filter(a => a.g >= 100 && a.n === 1 && a.cpa != null && a.cpa < T.cpa*0.7).sort((a,b) => a.cpa - b.cpa);
  const sp = D.regiao[0];

  const INS = [
    {cat:"Resultado", t:`O ingresso pagou o tráfego, e o produto veio de bônus`,
     ev:`Foram ${B(fmtMoeda(T.g))} investidos e ${B(fmtMoeda(T.vi))} faturados só com ingressos (ROAS de ${B(fmtX(T.roas))}). A captação se pagou antes do pitch.
         Em cima disso, o pixel atribuiu a essas campanhas ${B(fmtInt(T.cp)+" vendas do produto principal")} (cerca de ${B(fmtMoeda0(T.vp))}), o que leva o retorno total para ${B(fmtX((T.vi+T.vp)/T.g))}.`,
     rec:`Repetir o modelo de ingresso pago. A meta pra próxima captação é manter o ROAS do ingresso acima de 1x com volume maior, o que depende dos pontos abaixo.`},
    {cat:"Escala", t:`Escalar a verba quase triplicou o custo do ingresso`,

         O ROAS dos ingressos caiu de ${B(fmtX(f1.roas))} para ${B(fmtX(f2.roas))}: na fase de escala o ingresso não se pagou. A etapa que mais piorou foi página para checkout, de ${B(fmtPct(f1.tx_chk))} para ${B(fmtPct(f2.tx_chk))}.`,
     rec:`Subir a verba em degraus (20% a 30% a cada 2 ou 3 dias) e segurar o aumento quando o custo por ingresso passar de uns ${fmtMoeda0(f1.cpa*1.5)}. A verba extra foi para gente menos pronta para comprar: o clique continuou vindo, mas menos gente foi pro pagamento.`},
    {cat:"Reta final", t:`Os dois últimos dias venderam ${fmtPct(f3.ci*100/T.ci,0)} dos ingressos, pelo menor custo da captação`,
     ev:`Em ${dataBR(f3.ini)} e ${dataBR(f3.fim)} saíram ${B(fmtInt(f3.ci)+" ingressos")} a ${B(moedaOu(f3.cpa))} cada. Os checkouts chegaram a ${B(fmtPct(f3.tx_chk))} das visitas do período (contra ${B(fmtPct(f2.tx_chk))} na escala): muita gente que já tinha visitado a página voltou só pra comprar.

     rec:`Planejar a urgência como parte da captação: viradas de lote com data marcada a cada 4 ou 5 dias, cada uma com criativo e mensagem de "último dia", em vez de uma urgência só no fim.`},

    {cat:"Criativos", t:`Vídeo traz o clique, estático traz quem compra`,
     ev:`Vídeos ficaram com ${B(fmtPct(V.g*100/T.g,0)+" da verba")}, CTR de ${B(fmtPct(V.ctr,2))} e ${B(fmtPct(V.tx_chk))} das visitas indo para o pagamento. Estáticos tiveram metade do CTR (${B(fmtPct(E.ctr,2))}), mas ${B(fmtPct(E.tx_chk))} das visitas foram para o pagamento.
         No fim, custo por compra praticamente igual: ${B(moedaOu(V.cpa))} no vídeo e ${B(moedaOu(E.cpa))} no estático.
         O criativo que mais recebeu verba foi o ${B(esc(top.nome))}: ${B(fmtMoeda0(top.g))} (${fmtPct(top.g*100/T.g,0)} do total), CTR mais alto (${B(fmtPct(top.ctr,2))}), mas só ${B(fmtPct(top.tx_chk))} das visitas foram pro pagamento.`,
     rec:`Manter os dois formatos rodando juntos. No vídeo, deixar a oferta (data, preço, o que a pessoa leva) clara já nos primeiros segundos, pra filtrar o clique curioso. No estático, investir em variações, porque ele qualifica melhor.`},
    ...(finais.length ? [{cat:"Criativos", t:`Os criativos da última semana valem um teste desde o início`,
     ev:`${finais.slice(0,4).map(a => `${B(esc(a.nome))} (${moedaOu(a.cpa)} por compra, ${fmtInt(a.cp)} compras)`).join(", ")} ficaram bem abaixo da média de ${B(moedaOu(T.cpa))}.
         Atenção: eles só entraram nas campanhas v15 e v17, que rodaram de 09/09 e 10/09 até o fim e pegaram a reta final, quando a captação inteira converteu mais barato. Parte desse resultado é do momento, não só do criativo.`,
     rec:`Subir esses criativos já na primeira semana da próxima captação, lado a lado com os que mais gastaram, pra saber se o resultado se repete com preço e prazo normais.`}] : []),
    {cat:"Público", t:`Mulheres de 25 a 54 foram o centro da venda; homens compraram mais barato`,
     ev:`Mulheres receberam ${B(fmtPct(fem.g*100/(fem.g+mas.g),0)+" da verba")}, com custo por compra de ${B(moedaOu(cpaG(fem)))}. Homens ficaram com o resto e compraram a ${B(moedaOu(cpaG(mas)))}.
         Por idade, 25 a 34 teve o menor custo (${B(moedaOu(cpaG(id("25-34"))))}). Acima de 65 custou ${B(moedaOu(cpaG(id("65+"))))} e 18 a 24, ${B(moedaOu(cpaG(id("18-24"))))}. Quanto mais velho, mais clica (CTR de ${fmtPct(div(id("65+").c*100,id("65+").i),2)} acima de 65) e menos compra.`,
     rec:`Excluir 65+ e 18 a 24 das campanhas de ingresso e testar um conjunto voltado para homens, já que o custo foi menor com pouca verba. Vale confirmar se isso se mantém com mais investimento.`},
    {cat:"Posicionamento", t:`Instagram fez quase tudo; Audience Network só gerou clique acidental`,
     ev:`Instagram ficou com ${B(fmtPct(soma(ig,"g")*100/soma(D.posicao,"g"),0)+" da verba")}. Feed e Stories tiveram custo por compra parecido; Reels ficou um pouco acima.
         Na Audience Network, CTR de ${B(fmtPct(div(anM.c*100,anM.i),1))} (muito acima do resto) e ${B(fmtInt(anM.cp)+" compra")}: clique sem intenção.`,
     rec:`Excluir Audience Network nas campanhas de ingresso. O gasto foi pequeno (${fmtMoeda(anM.g)}), mas esses cliques sujam o aprendizado do pixel.`},
    {cat:"Região", t:`São Paulo recebeu ${fmtPct(sp.g*100/T.g,0)} da verba`,
     ev:`${B(nomeRegiao(sp.k))} concentrou ${B(fmtMoeda0(sp.g))}, seguido por ${D.regiao.slice(1,4).map(r => `${esc(nomeRegiao(r.k))} (${fmtMoeda0(r.g)})`).join(", ")}. A Meta não informa compras por estado, então não dá pra dizer onde o ingresso saiu mais barato.`,
     rec:`Se o evento tiver parte presencial ou foco regional, cruzar os compradores da plataforma de pagamento por estado para decidir se vale separar campanhas por região.`},
  ];
  return `<section>
    <div class="sec-head"><div><h2>Principais insights da captação</h2><p class="sub">O que os números mostram e o que fazer diferente no próximo lançamento.</p></div></div>
    <div class="ins-lista">${INS.map((x,i) => `<article class="card ins-card"><div class="num">${String(i+1).padStart(2,"0")}</div>
      <div class="cat">${esc(x.cat)}</div><h3>${x.t}</h3><div><p class="ev">${x.ev}</p><div class="rec">${x.rec}</div></div></article>`).join("")}</div>
  </section>`;
}

function desenhar(){
  const painel = {resumo:pResumo, dia:pDia, campanhas:pCampanhas, criativos:pCriativos, publico:pPublico, insights:pInsights}[ABA]();
  app.innerHTML = `<div class="wrap">
  <header><img src="logo.png" alt="C2Pro">
    <div><div class="eyebrow">Relatório de vendas de ingressos</div><h1>${esc(D.nome)}</h1></div></header>
  <div class="meta">
    <span>Captação: <b>${dataBRano(INI)} a ${dataBRano(FIM)}</b> (${ativos.length} dias com investimento)</span>
    <span>Campanhas com CAPTACAO no nome</span>
    <span>Dados da Meta até 06/10/2026</span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Seções do relatório">
    ${ABAS.map((a,i) => `<button class="tab${a.id==="insights"?" ins":""}" role="tab" data-aba="${a.id}" aria-selected="${ABA===a.id}"><span class="n">${String(i+1).padStart(2,"0")}</span>${a.nome}</button>`).join("")}
  </nav>
  <div class="panel" role="tabpanel">${painel}</div>
  <footer>
    <div class="defs"><b>Ingresso:</b> compra registrada pelo pixel da Meta nas campanhas de captação, sem as compras do produto principal.
      <b>Produto atribuído:</b> compras de cerca de ${fmtMoeda(D.preco_produto)} que o pixel atribuiu às campanhas de ingresso a partir de 15/09, separadas pelo valor da compra (estimativa).
      <b>CPM:</b> investimento ÷ impressões × 1.000. <b>CTR:</b> cliques no link ÷ impressões. <b>Connect rate:</b> visitas à página ÷ cliques.
      <b>Página para checkout:</b> checkouts ÷ visitas. <b>Checkout para compra:</b> ingressos ÷ checkouts. <b>ROAS:</b> faturamento ÷ investimento.</div>
    <div style="margin-top:12px">Dados puxados da API da Meta (conta CA-TODOS ARQUITETURA). Compras e faturamento são os que o pixel registrou e podem diferir da plataforma de pagamento. Relatório fechado, não atualiza sozinho. C2Pro.</div>
  </footer></div>`;

  app.querySelectorAll("[data-aba]").forEach(b => b.addEventListener("click", () => {
    ABA = b.dataset.aba; history.replaceState(null, "", "#" + ABA); desenhar();
    const nav = app.querySelector(".tabs"); window.scrollTo({top: Math.min(window.scrollY, nav.offsetTop), behavior:"instant"});
    app.querySelector(`[data-aba="${ABA}"]`).scrollIntoView({block:"nearest", inline:"nearest"});
  }));
  app.querySelectorAll("[data-oc]").forEach(b => b.addEventListener("click", () => { ORD_C = b.dataset.oc; const y = scrollY; desenhar(); scrollTo(0,y); }));
  app.querySelectorAll("[data-oa]").forEach(b => b.addEventListener("click", () => { ORD_A = b.dataset.oa; const y = scrollY; desenhar(); scrollTo(0,y); }));

  if (ABA === "dia") {
    const DD = ativos.map(der);
    graficoBarras(document.getElementById("c-ing"), DD.map(d => ({x:d.d, y:d.ci, g:d.g})),
      p => `<b>${dataBRano(p.x)}</b><br>Ingressos: ${fmtInt(p.y)}<br>Investimento: ${fmtMoeda(p.g)}<br>Custo por ingresso: ${moedaOu(div(p.g,p.y))}`);
    graficoBarras(document.getElementById("c-inv"), DD.map(d => ({x:d.d, y:d.g})),
      p => `<b>${dataBRano(p.x)}</b><br>Investimento: ${fmtMoeda(p.y)}`, v => fmtCompacto(v));
    graficoLinha(document.getElementById("c-cpa"), DD.map(d => ({x:d.d, y:d.cpa, ci:d.ci})),
      p => `<b>${dataBRano(p.x)}</b><br>Custo por ingresso: ${moedaOu(p.y)}<br>Ingressos: ${fmtInt(p.ci)}`, v => "R$ " + fmtInt(v), T.cpa);
    graficoLinha(document.getElementById("c-chk"), DD.map(d => ({x:d.d, y:d.tx_chk, l:d.l, k:d.k})),
      p => `<b>${dataBRano(p.x)}</b><br>Página para checkout: ${fmtPct(p.y)}<br>Visitas: ${fmtInt(p.l)} · Checkouts: ${fmtInt(p.k)}`, v => fmtInt(v) + "%", T.tx_chk);
  }
}

// ---------- gráficos (SVG puro) ----------
const NS = "http://www.w3.org/2000/svg";
const tipEl = document.getElementById("tip");
function escala(max){
  if (!(max > 0)) return {top:1, ticks:[0,1]};
  const passo0 = max / 3, mag = Math.pow(10, Math.floor(Math.log10(passo0)));
  const passo = [1,2,2.5,5,10].map(k => k*mag).find(p => p >= passo0);
  const top = Math.ceil(max / passo) * passo;
  const ticks = []; for (let v = 0; v <= top + 1e-9; v += passo) ticks.push(v);
  return {top, ticks};
}
function base(svg, pts, fmtEixo){
  const W = svg.clientWidth || 500, H = 200, L = 56, Rr = 8, T0 = 8, B = 24;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = "";
  const {top, ticks} = escala(Math.max(...pts.map(p => p.y || 0)));
  const y = v => T0 + (H - T0 - B) * (1 - v / top);
  const pw = (W - L - Rr) / pts.length;
  const x = i => L + pw * i + pw / 2;
  let g = "";
  ticks.forEach(t => {
    g += `<line x1="${L}" x2="${W-Rr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text class="axis" x="${L-8}" y="${y(t)+3}" text-anchor="end">${(fmtEixo||fmtCompacto)(t)}</text>`;
  });
  const ult = pts.length - 1;
  pts.forEach((p,i) => { if ((i % 5 === 0 && ult - i >= 3) || i === ult)
    g += `<text class="axis" x="${x(i)}" y="${H-6}" text-anchor="middle">${dataBR(p.x)}</text>`; });
  svg.insertAdjacentHTML("beforeend", g);
  return {W, H, L, Rr, T0, B, y, x, pw};
}
function hover(svg, pts, geo, conteudo, destacar){
  const alvo = document.createElementNS(NS, "rect");
  alvo.setAttribute("x", geo.L); alvo.setAttribute("y", 0);
  alvo.setAttribute("width", geo.W - geo.L - geo.Rr); alvo.setAttribute("height", geo.H - geo.B);
  alvo.setAttribute("fill", "transparent");
  svg.appendChild(alvo);
  const mover = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (geo.W / r.width);
    const i = Math.max(0, Math.min(pts.length - 1, Math.floor((px - geo.L) / geo.pw)));
    destacar(i);
    tipEl.innerHTML = conteudo(pts[i]);
    tipEl.style.opacity = 1;
    const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
    let left = ev.clientX + 14; if (left + tw > window.innerWidth - 8) left = ev.clientX - tw - 14;
    tipEl.style.left = Math.max(8, left) + window.scrollX + "px";
    tipEl.style.top = ev.clientY - th - 10 + window.scrollY + "px";
  };
  alvo.addEventListener("pointermove", mover);
  alvo.addEventListener("pointerdown", mover);
  alvo.addEventListener("pointerleave", () => { tipEl.style.opacity = 0; destacar(-1); });
}
function graficoBarras(svg, pts, tooltip, fmtEixo){
  const geo = base(svg, pts, fmtEixo);
  const bw = Math.max(2, geo.pw - 2), r = Math.min(4, bw / 2), y0 = geo.y(0);
  let g = "";
  pts.forEach((p,i) => {
    const x0 = geo.x(i) - bw/2, yt = geo.y(p.y), h = y0 - yt;
    if (h <= 0) return;
    const rr = Math.min(r, h);
    g += `<path data-i="${i}" fill="var(--acc)" d="M${x0},${y0} V${yt+rr} Q${x0},${yt} ${x0+rr},${yt} H${x0+bw-rr} Q${x0+bw},${yt} ${x0+bw},${yt+rr} V${y0} Z"/>`;
  });
  svg.insertAdjacentHTML("beforeend", g);
  const barras = [...svg.querySelectorAll("path[data-i]")];
  hover(svg, pts, geo, tooltip, i => barras.forEach(b => b.setAttribute("opacity", i < 0 || +b.dataset.i === i ? 1 : .35)));
}
function graficoLinha(svg, pts, tooltip, fmtEixo, media){
  const geo = base(svg, pts, fmtEixo);
  let d = "", aberto = false;
  pts.forEach((p,i) => { if (p.y == null) { aberto = false; return; } d += `${aberto ? "L" : "M"}${geo.x(i)},${geo.y(p.y)} `; aberto = true; });
  let g = "";
  if (media != null) g += `<line x1="${geo.L}" x2="${geo.W-geo.Rr}" y1="${geo.y(media)}" y2="${geo.y(media)}" stroke="var(--t-faint)" stroke-width="1" stroke-dasharray="4 4"/>
    <text class="axis" x="${geo.W-geo.Rr}" y="${geo.y(media)-5}" text-anchor="end">média</text>`;
  g += `<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += `<line id="cx" y1="${geo.T0}" y2="${geo.H-geo.B}" stroke="var(--b-strong)" stroke-width="1" opacity="0"/>`;
  g += `<circle id="pt" r="4.5" fill="var(--acc)" stroke="var(--solid)" stroke-width="2" opacity="0"/>`;
  svg.insertAdjacentHTML("beforeend", g);
  const cx = svg.querySelector("#cx"), pt = svg.querySelector("#pt");
  hover(svg, pts, geo, tooltip, i => {
    if (i < 0 || pts[i].y == null) { cx.setAttribute("opacity",0); pt.setAttribute("opacity",0); return; }
    cx.setAttribute("x1", geo.x(i)); cx.setAttribute("x2", geo.x(i)); cx.setAttribute("opacity", 1);
    pt.setAttribute("cx", geo.x(i)); pt.setAttribute("cy", geo.y(pts[i].y)); pt.setAttribute("opacity", 1);
  });
}

let tRes; window.addEventListener("resize", () => { clearTimeout(tRes); tRes = setTimeout(desenhar, 150); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (ABAS.some(a => a.id === h) && h !== ABA) { ABA = h; desenhar(); } });
desenhar();
})();
