function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function abrir(senha){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  var chave=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(PAYLOAD.sal),iterations:PAYLOAD.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);

  try{sessionStorage.setItem(CHAVE,senha);}catch(_){}
  document.open();document.write(html);document.close();
}
