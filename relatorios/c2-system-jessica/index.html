<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>C2 System Jessica</title>
<style>
  :root { --bg:#05070A; --card:#0A0E14; --line:rgba(255,255,255,.12); --t:#F2F6FA; --mut:#9AA6B6; --acc:#00D8F5; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--t);
         font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px;
         background-image:radial-gradient(900px 420px at 12% -8%, rgba(0,216,245,.10), transparent 60%); }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px; }
  img { height:28px; display:block; margin-bottom:20px; }
  h1 { font-size:20px; margin:0 0 6px; letter-spacing:-.02em; }
  p { color:var(--mut); font-size:14px; margin:0 0 18px; }
  label { display:block; font-size:12px; color:var(--mut); margin:12px 0 6px; }
  input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--t); font-size:15px; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  button { width:100%; margin-top:18px; padding:12px; border:0; border-radius:12px; background:var(--acc); color:#00171C; font-weight:700; font-size:15px; cursor:pointer; }
  .erro { color:#FF4D5E; min-height:20px; margin:10px 0 0; }
</style>
</head>
<body>
<form id="f">
  <img src="logo.png" alt="C2Pro">
  <h1>C2 System</h1>
  <p>Página interna da C2Pro. Entre com o seu usuário e a sua senha.</p>
  <label for="u">Usuário</label>
  <input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
  <label for="s">Senha</label>
  <input id="s" type="password" autocomplete="current-password">
  <button type="submit">Entrar</button>
  <p class="erro" id="e" role="alert"></p>
</form>

var CHAVE='c2sys-jessica';
function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function abrir(seg){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(seg),'PBKDF2',false,['deriveKey']);
  var chave=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(PAYLOAD.sal),iterations:PAYLOAD.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);

  try{sessionStorage.setItem(CHAVE,seg);}catch(_){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',function(ev){

  var seg=document.getElementById('u').value.trim().toLowerCase()+':'+document.getElementById('s').value;

});
