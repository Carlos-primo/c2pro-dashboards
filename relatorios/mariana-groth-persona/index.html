<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Persona Growth Compliance</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-app:#05070a; --bg-deep:#030507; --surface-solid:#0a0e14;
  --text-strong:#f2f6fa; --text-body:#c9d2dd; --text-muted:#9aa6b6; --text-faint:#6b788a;
  --accent:#00d8f5; --accent-hover:#37e6ff; --text-on-accent:#00171c;
  --positive:#23d18b; --attention:#ffb020; --negative:#ff4d5e;
  --border-subtle:rgba(255,255,255,.07); --border-default:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.2); --border-accent:rgba(0,216,245,.45);
  --surface-card:linear-gradient(180deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.018) 100%);
  --grad-halo:radial-gradient(60% 60% at 50% 0%,rgba(0,216,245,.22) 0%,rgba(0,74,173,.10) 45%,rgba(0,0,0,0) 100%);
  --grad-hairline:linear-gradient(90deg,rgba(0,216,245,0) 0%,rgba(0,216,245,.75) 50%,rgba(0,216,245,0) 100%);
  --grad-ink:linear-gradient(180deg,#f2f6fa 0%,#9aa6b6 100%);
  --elev-card:0 12px 32px -8px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06);
  --elev-card-hover:0 28px 64px -16px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08),0 0 28px -10px rgba(0,216,245,.4);
  --glow-sm:0 0 12px -2px rgba(0,216,245,.45),0 0 2px rgba(0,216,245,.5);
  --glow-md:0 0 24px -4px rgba(0,216,245,.5),0 0 60px -12px rgba(0,216,245,.3);
  --glow-text-strong:0 0 8px rgba(0,216,245,.6),0 0 28px rgba(0,216,245,.4);
  --status-attention-fill:linear-gradient(180deg,rgba(255,176,32,.10),rgba(255,176,32,.04));
  --status-attention-border:rgba(255,176,32,.35);
  --t-hover:transform 160ms cubic-bezier(.2,.7,.2,1),box-shadow 160ms cubic-bezier(.2,.7,.2,1),border-color 160ms cubic-bezier(.2,.7,.2,1);
  --ease-entrance:cubic-bezier(.16,1,.3,1);
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg-app);color:var(--text-body);font:400 15px/1.55 var(--font-sans);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:620px;background:var(--grad-halo);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
b,strong{color:var(--text-strong);font-weight:600}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 11px/1.2 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:var(--glow-sm)}
h1{font-weight:800;letter-spacing:-.035em;line-height:1.04;font-size:clamp(34px,5.6vw,60px);background:var(--grad-ink);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance;max-width:20ch}
h2{font-weight:700;letter-spacing:-.022em;line-height:1.15;font-size:clamp(24px,3vw,32px);color:var(--text-strong);text-wrap:balance}
h3{font-weight:700;letter-spacing:-.01em;font-size:17px;line-height:1.3;color:var(--text-strong)}
.muted{color:var(--text-muted)}
.cap{font-size:13.5px;line-height:1.5;color:var(--text-muted);max-width:72ch}
.hairline{height:1px;background:var(--grad-hairline);border:0}

/* topo */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding-top:14px;padding-bottom:14px}
.nav .bar{display:flex;align-items:center;gap:14px;padding:8px 10px 8px 14px;border-radius:999px;background:rgba(10,14,20,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border-default);overflow-x:auto;scrollbar-width:none}
.nav .bar::-webkit-scrollbar{display:none}
.nav img{width:24px;height:24px;flex:none}
.nav .brand{font-weight:800;letter-spacing:-.02em;color:var(--text-strong);flex:none}
.nav a{flex:none;font:500 13px/1 var(--font-sans);color:var(--text-muted);text-decoration:none;padding:8px 12px;border-radius:999px;transition:color 160ms,background 160ms}
.nav a:hover,.nav a:focus-visible{color:var(--text-strong);background:rgba(255,255,255,.06);outline:none}
.nav .sep{width:1px;height:18px;background:var(--border-default);flex:none}
header.hero{padding-top:40px;padding-bottom:12px;display:flex;flex-direction:column;gap:18px}
.lede{font-size:clamp(16px,1.6vw,19px);line-height:1.55;color:var(--text-body);max-width:62ch}
.lede .num{font-family:var(--font-mono);color:var(--accent-hover);text-shadow:var(--glow-text-strong);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;border:1px solid var(--border-default);background:rgba(10,14,20,.6);font-size:13px;color:var(--text-body);white-space:nowrap}

section{padding-top:56px;display:flex;flex-direction:column;gap:20px}
.shead{display:flex;flex-direction:column;gap:10px}

/* cards */
.card{background:var(--surface-card),var(--surface-solid);border:1px solid var(--border-subtle);border-radius:18px;box-shadow:var(--elev-card);padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:var(--t-hover)}
.card:hover{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:var(--elev-card-hover)}
.card.attn{background:var(--status-attention-fill),var(--surface-solid);border-color:var(--status-attention-border)}
.card.attn:hover{border-color:rgba(255,176,32,.6);box-shadow:var(--elev-card),0 0 24px -6px rgba(255,176,32,.45)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.grid4{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,265px),1fr))}
.grid3{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.kpis{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));padding-top:28px}
.kpi{padding:20px 22px;gap:10px}
.kpi .v{font:600 clamp(30px,3.4vw,40px)/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-strong);letter-spacing:-.02em}
.kpi.hl{border-color:var(--border-accent)}
.kpi.hl .v{color:var(--accent-hover);text-shadow:var(--glow-text-strong)}
.kpi.attn .v{color:var(--attention)}
.kpi .l{font:500 11px/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}

/* contatos */
.hot{border-color:var(--border-accent)}
.hot:hover{border-color:var(--accent);box-shadow:var(--elev-card-hover),var(--glow-sm)}
.tag{align-self:flex-start;font:600 10.5px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:999px;border:1px solid var(--border-accent);color:var(--accent);background:rgba(0,216,245,.06)}
.tag.fit{border-color:var(--border-default);color:var(--text-body);background:rgba(255,255,255,.03)}
.tag.re{border-color:var(--border-subtle);color:var(--text-muted);background:none}
.who{display:flex;flex-direction:column;gap:4px}
.who .n{font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--text-strong);line-height:1.2}
.who .p{font:500 12.5px/1.4 var(--font-mono);color:var(--text-muted)}
.motivo{color:var(--text-body);line-height:1.55}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px;line-height:1.45;padding-top:14px;border-top:1px solid var(--border-subtle)}
.kv dt{font:500 10.5px/1.6 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);white-space:nowrap}
.kv dd{color:var(--text-body);min-width:0}
.rounds{display:flex;gap:6px;align-items:center;font:500 11px/1 var(--font-mono);color:var(--text-muted);letter-spacing:.06em}
.rounds i{width:8px;height:8px;border-radius:50%;background:var(--border-strong)}
.rounds i.on{background:var(--accent);box-shadow:var(--glow-sm)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;padding:16px 0;border-top:1px solid var(--border-subtle);border-radius:12px;transition:background 160ms}
.row:first-child{border-top:0}
.row:hover{background:rgba(255,255,255,.025)}
.row .who .n{font-size:16px}
@media (max-width:680px){.row{grid-template-columns:1fr;gap:10px}}

/* nuvem */
.cloud{position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 18px;padding:20px 4px;min-height:220px}
.cloud button{all:unset;cursor:pointer;line-height:1.15;font-weight:700;letter-spacing:-.02em;border-radius:6px;padding:0 3px;transition:opacity 200ms,color 160ms,text-shadow 160ms}
.cloud button:hover{color:var(--accent-hover)!important}
.cloud button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cloud.sel button{opacity:.3}
.cloud.sel button.on{opacity:1;color:var(--accent-hover)!important;text-shadow:var(--glow-text-strong)}
.tip{position:absolute;pointer-events:none;background:rgba(10,14,20,.96);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--elev-card);padding:8px 12px;font-size:13px;white-space:nowrap;z-index:5}
.tip .t{color:var(--text-muted);font-size:12px}
.tip .c{font-family:var(--font-mono);color:var(--text-strong)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.btn{all:unset;cursor:pointer;font:500 13px/1 var(--font-sans);padding:9px 14px;border-radius:999px;border:1px solid var(--border-default);color:var(--text-body);transition:var(--t-hover)}
.btn:hover{border-color:var(--border-accent);color:var(--text-strong);transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* tabelas */
.tbl{overflow:auto;max-height:460px;border-radius:12px;border:1px solid var(--border-subtle)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font:500 10.5px/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);position:sticky;top:0;background:#0b1017;padding:10px 12px;border-bottom:1px solid var(--border-default);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border-subtle);vertical-align:top;line-height:1.5;color:var(--text-body)}
tr:last-child td{border-bottom:0}
tbody tr{transition:background 160ms}
tbody tr:hover{background:rgba(255,255,255,.03)}
td.id{font-family:var(--font-mono);color:var(--accent);white-space:nowrap}
td.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text-strong)}
mark{background:rgba(0,216,245,.14);color:var(--text-strong);border-radius:4px;padding:0 2px}

/* persona */
.item{display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:1px solid var(--border-subtle)}
.item:first-of-type{border-top:0;padding-top:0}
.item .tt{font-weight:700;color:var(--text-strong);font-size:15.5px;line-height:1.35}
.item .ev{font-size:12.5px;line-height:1.5;color:var(--text-faint)}
.item .ev em{font-style:normal;color:var(--text-muted)}
.contra{border-color:var(--border-accent)}
.contra .tt{font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--text-strong)}

/* barras */
.bars{display:flex;flex-direction:column;gap:14px}
.b{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:6px 12px;align-items:center;font-size:13.5px}
.b .lab{grid-column:1/-1;color:var(--text-body);line-height:1.35}
.b .track{height:8px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
.b .fill{height:100%;border-radius:999px;background:rgba(154,166,182,.45);transform-origin:left;animation:grow 700ms var(--ease-entrance) both}
.b.top .fill{background:var(--accent);box-shadow:var(--glow-sm)}
.b .num{text-align:right;font-family:var(--font-mono);color:var(--text-strong)}
.b.zero .num{color:var(--attention)}
.sub{font:500 10.5px/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);padding-top:6px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

ul.plain{list-style:none;display:flex;flex-direction:column;gap:12px}
ul.plain li{position:relative;padding-left:18px;line-height:1.55}
ul.plain li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
footer{padding-top:64px;padding-bottom:48px;display:flex;flex-direction:column;gap:18px}
footer .sig{display:flex;align-items:center;gap:12px;font:500 11px/1.4 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}
footer img{width:22px;height:22px}

.rv{animation:fadeUp 640ms var(--ease-entrance) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card:hover,.btn:hover{transform:none}html{scroll-behavior:auto}}

/* senha */
#lock{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--bg-app);z-index:30}
#lock::before{content:"";position:absolute;inset:0;background:var(--grad-halo);pointer-events:none}
#lock .box{position:relative;width:100%;max-width:380px;padding:32px 28px;border-radius:24px;background:var(--surface-card),var(--surface-solid);border:1px solid var(--border-default);box-shadow:var(--elev-card)}
#lock img{width:36px;height:36px}
#lock h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:18px;color:var(--text-strong);background:none;-webkit-background-clip:initial;background-clip:initial}
#lock p{font-size:14px;line-height:1.5;color:var(--text-muted);margin-top:8px}
#lock form{margin-top:22px;display:flex;flex-direction:column;gap:12px}
#lock input[type=password]{height:46px;border-radius:12px;border:1px solid var(--border-default);background:rgba(5,7,10,.6);color:var(--text-strong);padding:0 14px;font:500 15px var(--font-sans)}
#lock input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
#lock label{font-size:13px;color:var(--text-muted);display:flex;gap:8px;align-items:center}
#lock button{height:46px;border-radius:12px;border:0;background:var(--accent);color:var(--text-on-accent);font:700 15px var(--font-sans);cursor:pointer;box-shadow:var(--glow-sm);transition:var(--t-hover)}
#lock button:hover{transform:translateY(-2px);box-shadow:var(--glow-md)}
#lock .err{color:var(--negative);font-size:13px;min-height:18px}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <img src="logo.png" alt="C2Pro">
  <h1>Pesquisa de persona · Growth Compliance</h1>
  <p>Página privada. Digite a senha que você recebeu.</p>
  <form id="f">
    <input type="password" id="s" placeholder="Senha" autocomplete="current-password" aria-label="Senha" autofocus>
    <label><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
    <button type="submit">Abrir</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div></div>
<div id="app" hidden></div>

var CHAVE='c2pro-mariana-groth-persona';
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function decifrar(senha){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  var chave=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.sal),iterations:PAYLOAD.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var txt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},chave,b64(PAYLOAD.ct));
  return new TextDecoder().decode(txt);
}
function abrir(html){
  var app=document.getElementById('app');
  app.innerHTML=html;
  document.getElementById('lock').remove();
  app.hidden=false;
  iniciar(JSON.parse(document.getElementById('dados').textContent));
  if(location.hash){var a=document.getElementById(location.hash.slice(1));if(a)a.scrollIntoView()}
}
(async function(){
  var salva=null; try{salva=localStorage.getItem(CHAVE)}catch(_){}
  if(salva){try{return abrir(await decifrar(salva))}catch(_){try{localStorage.removeItem(CHAVE)}catch(_){}}}
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var s=document.getElementById('s').value;
    try{
      var html=await decifrar(s);
      try{if(document.getElementById('lembrar').checked) localStorage.setItem(CHAVE,s)}catch(_){}
      abrir(html);
    }catch(_){document.getElementById('err').textContent='Senha incorreta.'}
  });
})();
